name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Monday 00:10 JST
    - cron: '10 15 * * 0'
  workflow_dispatch:
  # BBS (/bbs/) は GitHub Discussions をビルド時に静的化しているので、
  # スレッドの作成・コメントで再ビルドして一覧へ反映する
  discussion:
    types: [created, edited, deleted, transferred, category_changed, locked, unlocked]
  discussion_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  deployments: read
  discussions: read
  pages: write
  id-token: write

# 排他はジョブごとに分ける。
# - build: 後から push が来たら、走っている古い build は取り消す。どの run も main の
#   最新を作り直すので、古い build を最後まで流しても公開されるのは次の run の結果になる
# - deploy: 進行中の Pages デプロイは中断しない。中断すると Pages 側のデプロイが
#   error のまま残り、後続のデプロイが deployment_queued から進まなくなる事があるため。
#   待機中のものは Actions 標準の pending 置換で最新の 1 件だけが残る
jobs:
  # 技術ノート・ML ノートの関門（notes-quality/gate.py）。最後に公開した版から変えたノートが規則と
  # 総合 4 以上の点の記録を満たさなければ、そのノートだけを最後に公開した版に戻して（新規なら外して）
  # ビルドする。記事・weeknotes の公開は止めない（2026-11-12 著者の指定）
  notes-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.base.outputs.sha }}
      ng: ${{ steps.gate.outputs.ng }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # 起点は「最後に公開に成功した commit」。直前の push を起点にすると、hook を飛ばして
      # push した関門 NG のノートが、次の別の push で差分から外れて公開されてしまうため
      - name: Find last successful Pages deployment
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          for row in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id):\(.sha)"'); do
            id="${row%%:*}"; sha="${row##*:}"
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state' || true)
            if [ "$state" = "success" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then base="$sha"; break; fi
          done
          echo "sha=${base:-${{ github.event.before }}}" >> "$GITHUB_OUTPUT"
          echo "base: ${base:-${{ github.event.before }}（公開の記録が見つからず、直前の push を起点にした）}"
      - name: Check notes changed since the last deployment
        id: gate
        run: |
          python3 notes-quality/gate.py push "${{ steps.base.outputs.sha }}" "${{ github.sha }}" --ng-list ng.txt || true
          touch ng.txt
          while read -r d; do [ -n "$d" ] && echo "::warning title=notes-gate::$d は関門を通らないので、最後に公開した版でビルドする（新規なら外す）"; done < ng.txt
          { echo 'ng<<NG_EOF'; cat ng.txt; echo 'NG_EOF'; } >> "$GITHUB_OUTPUT"

  build:
    needs: notes-gate
    if: always() && (needs.notes-gate.result == 'success' || needs.notes-gate.result == 'skipped')
    # Keep the OS within the pinned Playwright version's supported platforms.
    runs-on: ubuntu-24.04
    # 普段は 3 分前後で終わる。apt やネットワークで固まった時に既定の 6 時間待たない
    timeout-minutes: 20
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      HUGO_VERSION: '0.166.0'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: true
          # enableGitInfo の更新日に全履歴のコミットと tree が要る。過去の blob は
          # 使わないので取らない（Hugo のビルド中に追加の取得が起きない事を確認済み）
          fetch-depth: 0
          filter: blob:none

      - name: Keep notes that fail the gate at their last deployed version
        if: needs.notes-gate.outputs.ng != ''
        env:
          NG: ${{ needs.notes-gate.outputs.ng }}
          BASE: ${{ needs.notes-gate.outputs.base }}
        run: |
          while read -r d; do
            [ -z "$d" ] && continue
            rm -rf "$d"
            if git cat-file -e "$BASE:$d/index.md" 2>/dev/null; then
              git checkout "$BASE" -- "$d"
              echo "最後に公開した版に戻した: $d"
            else
              echo "新規で関門を通らないので外した: $d"
            fi
          done <<< "$NG"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Hugo は元画像と変換条件に応じてキャッシュを選ぶため、前のコミットの
      # 変換済み画像も再利用できる。Hugo 更新時は別のキャッシュに切り替える。
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: resources/_gen/images
          key: ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-images-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-images-v1-

      - name: Test migration checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check legacy redirect tables are up to date
        run: make redirects-check

      # BBS のスレッド一覧を Discussions から取得する (data/bbs.json)。
      # リポジトリに入っている JSON はローカル確認用のスナップショットで、
      # 本番は常にここで取り直す
      - name: Fetch BBS threads from GitHub Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_bbs.py

      # 週次 schedule / 手動実行 / 通常デプロイ時に更新。閲覧時の API 通信は不要。
      - name: Refresh OSS star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_oss_stars.py

      - name: Setup Node for browser checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Playwright が入れる Chromium は版ごとに同じなので使い回す
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      # ブラウザ検査に要るライブラリは runner に最初から入っており、apt で足すのは
      # フォント 10 個だけ（playwright install-deps の 9 個と fonts-noto-cjk）。
      # apt は何度も止まった: 2026-11-06 にミラー待ちで 10 分以上、2026-11-11 には
      # azure.archive.ubuntu.com も archive.ubuntu.com も名前解決できなくなった。
      # 入れる順は cache → GitHub Release の同じ .deb → apt → フォント無し
      - name: Restore browser font packages
        id: font-debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-font-debs
          key: ${{ runner.os }}-${{ runner.arch }}-font-debs-v1

      - name: Install browser test dependencies
        id: browser-deps
        timeout-minutes: 14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            npx playwright install chromium
          fi

          debs="${HOME}/.cache/ci-font-debs"
          if [ "${{ steps.font-debs.outputs.cache-hit }}" = 'true' ] &&
             sudo dpkg -i "${debs}"/*.deb > /dev/null; then
            sudo fc-cache -f > /dev/null
            echo "cache のフォント $(find "${debs}" -name "*.deb" | wc -l) 個を入れた"
            exit 0
          fi

          # cache が無い時は、同じ版の .deb を置いた Release から取る。GitHub から
          # 取るので Ubuntu のミラーにも DNS にも頼らない。asset は noble の
          # Packages の SHA256 で照合する。runner の Ubuntu が替わったら apt へ回す
          release_tag=ci-font-debs-noble-v1
          if [ "$(. /etc/os-release && echo "${VERSION_CODENAME}")" = noble ]; then
            rm -rf "${debs}" && mkdir -p "${debs}"
            if timeout 300 gh release download "${release_tag}" --repo "${GITHUB_REPOSITORY}" --dir "${debs}" &&
               (cd "${debs}" && sha256sum --quiet -c SHA256SUMS) &&
               sudo dpkg -i "${debs}"/*.deb > /dev/null; then
              sudo fc-cache -f > /dev/null
              echo "Release ${release_tag} のフォント $(find "${debs}" -name "*.deb" | wc -l) 個を入れた"
              echo "save=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::warning::Release ${release_tag} からフォントを入れられなかった。apt で入れる"
            rm -rf "${debs}"
          fi

          # 応答の無いミラーで延々と待たず、短く諦めて取り直させる。
          # ロックは即諦めずに少し待つ
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "60";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          sudo rm -f /var/cache/apt/archives/*.deb

          # timeout が止めるのは npx だけで、npx が起動した sudo apt-get は残って
          # ロックを持ち続ける（2026-11-11 に 2 回目以降が即 "Could not get lock"）。
          # やり直す前に止め、消えるまで待つ
          stop_leftover_apt() {
            sudo pkill -x apt-get || true
            for _ in $(seq 1 30); do
              pgrep -x apt-get > /dev/null || return 0
              sleep 2
            done
            sudo pkill -9 -x apt-get || true
            sleep 2
          }

          # *.ubuntu.com がまとめて引けない時に備え、別ドメインのミラーへ替える
          use_fallback_mirrors() {
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "現在のミラー一覧:"
              cat /etc/apt/apt-mirrors.txt
              printf '%s\tpriority:%s\n' \
                http://mirrors.edge.kernel.org/ubuntu/ 1 \
                http://mirror.math.princeton.edu/pub/ubuntu/ 2 \
                http://ftp.jaist.ac.jp/pub/Linux/ubuntu/ 3 \
                http://archive.ubuntu.com/ubuntu/ 4 |
                sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fi
          }

          installed=false
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 npx playwright install-deps chromium &&
               timeout --kill-after=10 120 sudo apt-get install -y --no-install-recommends fonts-noto-cjk; then
              installed=true
              break
            fi
            echo "::warning::apt の導入に失敗した (${attempt} 回目)。残った apt-get を止め、ミラーを替えてやり直す"
            stop_leftover_apt
            use_fallback_mirrors
            sleep 5
          done

          if [ "${installed}" = true ]; then
            mkdir -p "${debs}"
            cp /var/cache/apt/archives/*.deb "${debs}/" 2> /dev/null || true
            echo "save=$([ -n "$(ls -A "${debs}")" ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # ライブラリは揃っているので、フォントが無くても検査は動く。日本語の字形が
          # 違うまま検査する事になるので、警告を残して先へ進む
          echo "::warning::apt でフォントを入れられなかった。runner 既定のフォントでブラウザ検査を続ける"

      - name: Save browser font packages
        if: steps.browser-deps.outputs.save == 'true' && steps.font-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ci-font-debs
          key: ${{ steps.font-debs.outputs.cache-primary-key }}

      - name: Build site
        # 不要になった変換結果を削除してからキャッシュを保存する。
        run: |
          hugo --minify --gc
          node scripts/generate_note_ogp.mjs

      # 生成後の public/ を検査する。リンク切れのまま公開すると、直前の
      # デプロイまで正常だったURLが落ちるため、artifact を上げる前に止める。
      # 外部サイトは 403/429 で不安定なので見に行かない（muffet は手元で
      # make lint-links-external を使う）
      - name: Check internal links
        run: python3 scripts/check_links.py

      - name: Check AdSense loading
        run: python3 scripts/check_adsense.py

      - name: Check homepage batches and archive delivery
        run: |
          python3 scripts/check_home_delivery.py
          python3 scripts/check_archive_delivery.py
          python3 scripts/check_performance_budgets.py
          node --test scripts/check_home_lists.mjs scripts/check_mermaid_lazy.mjs scripts/check_search_loading.mjs scripts/check_new_badges.mjs

      - name: Check asset delivery
        run: python3 scripts/check_asset_delivery.py

      - name: Check responsive images
        run: python3 scripts/check_image_delivery.py

      - name: Check pagination SEO
        run: python3 scripts/check_pagination_seo.py

      - name: Check Twitter embeds
        run: python3 scripts/check_twitter_embeds.py

      - name: Check Weeknotes migration
        run: python3 scripts/check_weeknotes.py

      - name: Check browser interactions before publishing
        timeout-minutes: 6
        run: make check-browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-failure
          path: reports/browser/
          if-no-files-found: ignore
          retention-days: 7

      # デプロイが失敗した際に成果物の状態を後から判断できるようにする。
      # ファイルの内容には触れず、パスとサイズだけを記録する
      - name: Report public directory size
        run: |
          set -eu
          sizes="$(mktemp)"
          # sort の出力を一旦ファイルへ受ける。head へ直接パイプすると
          # SIGPIPE でパイプライン全体が失敗し得るため
          find public -type f -printf '%s\t%p\n' | sort -nr > "${sizes}"
          total="$(du -sh public | cut -f1)"
          count="$(wc -l < "${sizes}")"
          echo "public size : ${total}"
          echo "public files: ${count}"
          echo "top 20 largest files (bytes, path):"
          head -20 "${sizes}"
          {
            echo "### Pages artifact (public/)"
            echo ""
            echo "- total size: ${total}"
            echo "- file count: ${count}"
            echo ""
            echo "| bytes | path |"
            echo "| --- | --- |"
            head -20 "${sizes}" | awk -F'\t' '{printf "| %s | %s |\n", $1, $2}'
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f "${sizes}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # GitHub Pages 側が syncing_files のまま 10 分を超え、deploy-pages が
      # timeout で落ちる事がある（2026-11-10 に 2 回）。timeout 時は deploy-pages が
      # その deployment を取り消すので、同じ artifact でもう一度だけ出し直す
      - name: Deploy to GitHub Pages
        id: first-attempt
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages v5 は timeout を 600000ms (10 分) で頭打ちにする
          # (src/internal/deployment.js の MAX_TIMEOUT)。900000 を渡すと警告付きで
          # 600000 へ丸められるため、上限である事を明示する意味で 600000 を指定する
          timeout: "600000"

      - name: Retry deploy to GitHub Pages
        id: retry
        if: steps.first-attempt.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: "600000"

      - name: Expose deployment URL
        id: deployment
        env:
          FIRST_URL: ${{ steps.first-attempt.outputs.page_url }}
          RETRY_URL: ${{ steps.retry.outputs.page_url }}
        run: echo "page_url=${RETRY_URL:-$FIRST_URL}" >> "$GITHUB_OUTPUT"
