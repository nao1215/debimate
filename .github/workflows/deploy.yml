name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Monday 00:10 JST
    - cron: '10 15 * * 0'
  workflow_dispatch:
  # BBS (/bbs/) は GitHub Discussions をビルド時に静的化しているので、
  # スレッドの作成・コメントで再ビルドして一覧へ反映する
  discussion:
    types: [created, edited, deleted, transferred, category_changed, locked, unlocked]
  discussion_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

# 排他はジョブごとに分ける。
# - build: 後から push が来たら、走っている古い build は取り消す。どの run も main の
#   最新を作り直すので、古い build を最後まで流しても公開されるのは次の run の結果になる
# - deploy: 進行中の Pages デプロイは中断しない。中断すると Pages 側のデプロイが
#   error のまま残り、後続のデプロイが deployment_queued から進まなくなる事があるため。
#   待機中のものは Actions 標準の pending 置換で最新の 1 件だけが残る
jobs:
  build:
    # Keep the OS within the pinned Playwright version's supported platforms.
    runs-on: ubuntu-24.04
    # 普段は 3 分前後で終わる。apt やネットワークで固まった時に既定の 6 時間待たない
    timeout-minutes: 20
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      HUGO_VERSION: '0.166.0'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: true
          # enableGitInfo の更新日に全履歴のコミットと tree が要る。過去の blob は
          # 使わないので取らない（Hugo のビルド中に追加の取得が起きない事を確認済み）
          fetch-depth: 0
          filter: blob:none

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Hugo は元画像と変換条件に応じてキャッシュを選ぶため、前のコミットの
      # 変換済み画像も再利用できる。Hugo 更新時は別のキャッシュに切り替える。
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: resources/_gen/images
          key: ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-images-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hugo-${{ env.HUGO_VERSION }}-images-v1-

      - name: Test migration checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check legacy redirect tables are up to date
        run: make redirects-check

      # BBS のスレッド一覧を Discussions から取得する (data/bbs.json)。
      # リポジトリに入っている JSON はローカル確認用のスナップショットで、
      # 本番は常にここで取り直す
      - name: Fetch BBS threads from GitHub Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_bbs.py

      # 週次 schedule / 手動実行 / 通常デプロイ時に更新。閲覧時の API 通信は不要。
      - name: Refresh OSS star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_oss_stars.py

      - name: Setup Node for browser checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Playwright が入れる Chromium は版ごとに同じなので使い回す
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}

      # apt のミラー待ちで固まった事がある (2026-11-06 に 10 分以上)。1 回ずつに
      # 時間の上限を付けて、固まったらやり直す。
      # 2026-11-11 には azure.archive.ubuntu.com の名前解決が続けて失敗した。
      # その時、timeout が止めるのは npx だけで、npx が起動した sudo apt-get は
      # 残ってロックを持ち続け、2 回目以降が即 "Could not get lock" で落ちていた。
      # やり直す前に残った apt-get を止め、ミラーを archive.ubuntu.com に替える
      - name: Install browser test dependencies
        timeout-minutes: 14
        run: |
          set -eu
          # 応答の無いミラーで延々と待たず、短く諦めて取り直させる。
          # ロックは即諦めずに少し待つ
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "60";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            npx playwright install chromium
          fi

          # 前の試行が残した apt-get を止め、ロックが外れるまで待つ
          stop_leftover_apt() {
            sudo pkill -x apt-get || true
            for _ in $(seq 1 30); do
              pgrep -x apt-get > /dev/null || return 0
              sleep 2
            done
            sudo pkill -9 -x apt-get || true
            sleep 2
          }

          # 既定の Azure ミラーが引けない時は Ubuntu 本家だけを見るようにする
          use_fallback_mirror() {
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "現在のミラー一覧:"
              cat /etc/apt/apt-mirrors.txt
              printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' |
                sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fi
            sudo find /etc/apt/sources.list /etc/apt/sources.list.d -type f \
              \( -name '*.list' -o -name '*.sources' -o -name sources.list \) \
              -exec sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' {} + 2> /dev/null || true
          }

          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 npx playwright install-deps chromium &&
               timeout --kill-after=10 120 sudo apt-get install -y --no-install-recommends fonts-noto-cjk; then
              exit 0
            fi
            echo "::warning::apt の導入に失敗した (${attempt} 回目)。残った apt-get を止めてやり直す"
            stop_leftover_apt
            if ! getent hosts azure.archive.ubuntu.com > /dev/null; then
              echo "::warning::azure.archive.ubuntu.com を名前解決できない。archive.ubuntu.com に切り替える"
              use_fallback_mirror
            fi
            sleep 5
          done
          exit 1

      - name: Build site
        # 不要になった変換結果を削除してからキャッシュを保存する。
        run: |
          hugo --minify --gc
          node scripts/generate_note_ogp.mjs

      # 生成後の public/ を検査する。リンク切れのまま公開すると、直前の
      # デプロイまで正常だったURLが落ちるため、artifact を上げる前に止める。
      # 外部サイトは 403/429 で不安定なので見に行かない（muffet は手元で
      # make lint-links-external を使う）
      - name: Check internal links
        run: python3 scripts/check_links.py

      - name: Check AdSense loading
        run: python3 scripts/check_adsense.py

      - name: Check homepage batches and archive delivery
        run: |
          python3 scripts/check_home_delivery.py
          python3 scripts/check_archive_delivery.py
          python3 scripts/check_performance_budgets.py
          node --test scripts/check_home_lists.mjs scripts/check_mermaid_lazy.mjs scripts/check_search_loading.mjs scripts/check_new_badges.mjs

      - name: Check asset delivery
        run: python3 scripts/check_asset_delivery.py

      - name: Check responsive images
        run: python3 scripts/check_image_delivery.py

      - name: Check pagination SEO
        run: python3 scripts/check_pagination_seo.py

      - name: Check Twitter embeds
        run: python3 scripts/check_twitter_embeds.py

      - name: Check Weeknotes migration
        run: python3 scripts/check_weeknotes.py

      - name: Check browser interactions before publishing
        timeout-minutes: 6
        run: make check-browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-failure
          path: reports/browser/
          if-no-files-found: ignore
          retention-days: 7

      # デプロイが失敗した際に成果物の状態を後から判断できるようにする。
      # ファイルの内容には触れず、パスとサイズだけを記録する
      - name: Report public directory size
        run: |
          set -eu
          sizes="$(mktemp)"
          # sort の出力を一旦ファイルへ受ける。head へ直接パイプすると
          # SIGPIPE でパイプライン全体が失敗し得るため
          find public -type f -printf '%s\t%p\n' | sort -nr > "${sizes}"
          total="$(du -sh public | cut -f1)"
          count="$(wc -l < "${sizes}")"
          echo "public size : ${total}"
          echo "public files: ${count}"
          echo "top 20 largest files (bytes, path):"
          head -20 "${sizes}"
          {
            echo "### Pages artifact (public/)"
            echo ""
            echo "- total size: ${total}"
            echo "- file count: ${count}"
            echo ""
            echo "| bytes | path |"
            echo "| --- | --- |"
            head -20 "${sizes}" | awk -F'\t' '{printf "| %s | %s |\n", $1, $2}'
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f "${sizes}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # GitHub Pages 側が syncing_files のまま 10 分を超え、deploy-pages が
      # timeout で落ちる事がある（2026-11-10 に 2 回）。timeout 時は deploy-pages が
      # その deployment を取り消すので、同じ artifact でもう一度だけ出し直す
      - name: Deploy to GitHub Pages
        id: first-attempt
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages v5 は timeout を 600000ms (10 分) で頭打ちにする
          # (src/internal/deployment.js の MAX_TIMEOUT)。900000 を渡すと警告付きで
          # 600000 へ丸められるため、上限である事を明示する意味で 600000 を指定する
          timeout: "600000"

      - name: Retry deploy to GitHub Pages
        id: retry
        if: steps.first-attempt.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: "600000"

      - name: Expose deployment URL
        id: deployment
        env:
          FIRST_URL: ${{ steps.first-attempt.outputs.page_url }}
          RETRY_URL: ${{ steps.retry.outputs.page_url }}
        run: echo "page_url=${RETRY_URL:-$FIRST_URL}" >> "$GITHUB_OUTPUT"
