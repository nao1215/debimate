# フラット構成: /bbs/ ページ 1 枚に General カテゴリのスレッドをぶら下げる。
# 各ページの front matter で comments: true にしたページだけ表示する。
[giscus]
  enabled = true
  repo = "nao1215/debimate"
  repoId = "R_kgDOQPrmZA"
  category = "General"
  categoryId = "DIC_kwDOQPrmZM4C-P6V"
  discussionUrl = "https://github.com/nao1215/debimate/discussions"
  mapping = "pathname"
  strict = "1"
  reactionsEnabled = "0"
  emitMetadata = "0"
  inputPosition = "bottom"
  lang = "ja"
  loading = "lazy"
