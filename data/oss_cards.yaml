# トップページの Featured OSS カードで紹介する候補。
# 全件を HTML へ出力し、表示する 1 枚は閲覧時に JavaScript が選ぶ。
# data/oss_catalog.json にある OSS をここに追記すれば候補が増える。
# star 数はカタログから参照し、GitHub Actions の定期更新に追従する。
# awesome: true を付けると、README と同じ Awesome Go のバッジを併記する。
- name: gup
  repo: https://github.com/nao1215/gup
  lang: Go
  langColor: "#00ADD8"
  awesome: true
  desc: go install でインストールしたバイナリを並行更新し、環境間でエクスポート／インポートするツール

- name: atago
  repo: https://github.com/nao1215/atago
  lang: Go
  langColor: "#00ADD8"
  desc: YAML で定義したテスト条件に基づき、CLI の終了コード・出力・ファイル差分・スナップショット・TUI まで検証する E2E テストツール

- name: markdown
  repo: https://github.com/nao1215/markdown
  lang: Go
  langColor: "#00ADD8"
  awesome: true
  desc: Markdown と Mermaid 図を組み立てるための Go ライブラリ
# gozen は右の帯で固定表示するので、左のランダムの候補から外した（2026-11-10）。
