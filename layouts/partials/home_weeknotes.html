<section class="home-weeknotes" aria-labelledby="home-weeknotes-title">
  <div class="home-section-heading">
    <h2 id="home-weeknotes-title">Weeknotes</h2>
    <a href="{{ "/weeknotes/" | relURL }}">一覧 →</a>
  </div>
  {{- $topics := partial "weeknotes/topics.html" . }}
  {{- $cards := slice -}}
  {{- range $topics }}
  {{- $cards = $cards | append (partial "home_weeknote_card.html" .) -}}
  {{- end }}
{{ partial "home_list.html" (dict "cards" $cards "batch" 3 "key" "weeknotes") }}
</section>
