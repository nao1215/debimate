<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Holder は早めに手放し、Grantor は遅めに次の相手へ貸す</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="m-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="706" y="60" width="162" height="300" rx="0" fill="#f2f2f2" stroke="none" stroke-width="0"/>
<text x="787.0" y="400" font-size="26" text-anchor="middle" style="fill:#1f1f1f">空白</text>
<text x="787.0" y="432" font-size="24" text-anchor="middle" style="fill:#666666">誰も持たない</text>
<text x="30" y="134" font-size="28" text-anchor="start" style="fill:#1f1f1f">Grantor</text>
<rect x="274" y="100" width="540" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="544.0" y="134" font-size="24" text-anchor="middle" style="fill:#1f1f1f">応答から数えて貸す</text>
<text x="814" y="184" font-size="24" text-anchor="middle" style="fill:#666666">期限</text>
<rect x="814" y="100" width="54" height="50" rx="8" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="868" y="86" font-size="24" text-anchor="middle" style="fill:#666666">次に貸す</text>
<text x="30" y="284" font-size="28" text-anchor="start" style="fill:#1f1f1f">Holder</text>
<rect x="220" y="250" width="486" height="50" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="463.0" y="284" font-size="24" text-anchor="middle" style="fill:#1f1f1f">要求から数えて使う</text>
<text x="760" y="334" font-size="24" text-anchor="middle" style="fill:#666666">期限</text>
<rect x="706" y="250" width="54" height="50" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="706" y="236" font-size="24" text-anchor="middle" style="fill:#666666">手放す</text>
<line x1="220" y1="250" x2="274" y2="156" stroke="#666666" stroke-width="3" marker-end="url(#m-sub)"/>
<text x="220" y="332" font-size="24" text-anchor="middle" style="fill:#666666">要求</text>
<rect x="220" y="470" width="44" height="30" rx="4" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="276" y="494" font-size="24" text-anchor="start" style="fill:#666666">時計のずれに見込むマージン</text>
</svg>
