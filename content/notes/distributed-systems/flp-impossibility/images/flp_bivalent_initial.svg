<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>初期値を 1 台ずつ変えて並べると、0-valent と 1-valent が隣り合う</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#596b76"/></marker></defs>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<rect width="960" height="540" fill="white"/>
<text x="40" y="56" font-size="26" text-anchor="start" fill="#666666" font-weight="normal">仮定：bivalent な初期状態が無い</text>
<rect x="40" y="140" width="130" height="90" rx="8" fill="#eaf1f5" stroke="#7aa6c2"/>
<text x="105.0" y="195" font-size="26" text-anchor="middle" fill="#28343b" font-weight="normal">(0, 0, 0)</text>
<text x="105.0" y="270" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">0-valent</text>
<rect x="290" y="140" width="130" height="90" rx="8" fill="#eaf1f5" stroke="#7aa6c2"/>
<text x="355.0" y="195" font-size="26" text-anchor="middle" fill="#28343b" font-weight="normal">(1, 0, 0)</text>
<text x="355.0" y="270" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">0-valent</text>
<line x1="180" y1="185.0" x2="280" y2="185.0" stroke="#666666" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="230.0" y="169.0" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">p0 を 1 に</text>
<rect x="540" y="140" width="130" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c"/>
<text x="605.0" y="195" font-size="26" text-anchor="middle" fill="#28343b" font-weight="normal">(1, 1, 0)</text>
<text x="605.0" y="270" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">1-valent</text>
<line x1="430" y1="185.0" x2="530" y2="185.0" stroke="#666666" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480.0" y="169.0" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">p1 を 1 に</text>
<rect x="790" y="140" width="130" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c"/>
<text x="855.0" y="195" font-size="26" text-anchor="middle" fill="#28343b" font-weight="normal">(1, 1, 1)</text>
<text x="855.0" y="270" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">1-valent</text>
<line x1="680" y1="185.0" x2="780" y2="185.0" stroke="#666666" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="730.0" y="169.0" font-size="24" text-anchor="middle" fill="#666666" font-weight="normal">p2 を 1 に</text>
<line x1="290" y1="330" x2="290" y2="345" stroke="#1f1f1f" stroke-width="2"/>
<line x1="290" y1="345" x2="670" y2="345" stroke="#1f1f1f" stroke-width="2"/>
<line x1="670" y1="330" x2="670" y2="345" stroke="#1f1f1f" stroke-width="2"/>
<text x="480.0" y="384" font-size="26" text-anchor="middle" fill="#28343b" font-weight="normal">隣り合う 2 つの違いは p1 の初期値だけ</text>
<rect x="130" y="420" width="700" height="96" rx="8" fill="#f2f2f2" stroke="#666666"/>
<text x="480" y="458" font-size="24" text-anchor="middle" fill="#28343b" font-weight="normal">p1 が一切動かない実行では、残りの 2 台に</text>
<text x="480" y="494" font-size="24" text-anchor="middle" fill="#28343b" font-weight="normal">2 つは区別できず、同じ値に決まる（仮定と矛盾）</text>
</svg>
