<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs><rect width="720" height="270" fill="#ffffff"/><rect x="10" y="10" width="340" height="250" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="1"/><text x="180" y="40" font-size="18" text-anchor="middle" font-weight="normal" fill="#1f1f1f">Crash fault（停止）</text><rect x="370" y="10" width="340" height="250" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="1"/><text x="540" y="40" font-size="18" text-anchor="middle" font-weight="normal" fill="#1f1f1f">Byzantine fault（二枚舌）</text><circle cx="90" cy="140" r="24" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="5 4"/><text x="90" y="146" font-size="17" text-anchor="middle" font-weight="normal" fill="#666666">A</text><text x="90" y="195" font-size="15" text-anchor="middle" font-weight="normal" fill="#666666">何も送らない</text><circle cx="270" cy="90" r="24" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/><text x="270" y="96" font-size="17" text-anchor="middle" font-weight="normal" fill="#1f1f1f">B</text><circle cx="270" cy="190" r="24" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/><text x="270" y="196" font-size="17" text-anchor="middle" font-weight="normal" fill="#1f1f1f">C</text><text x="180" y="240" font-size="15" text-anchor="middle" font-weight="normal" fill="#666666">B と C に届く値は食い違わない</text><circle cx="450" cy="140" r="24" fill="#ffffff" stroke="#e15759" stroke-width="2"/><text x="450" y="146" font-size="17" text-anchor="middle" font-weight="normal" fill="#e15759">A</text><circle cx="630" cy="90" r="24" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/><text x="630" y="96" font-size="17" text-anchor="middle" font-weight="normal" fill="#1f1f1f">B</text><circle cx="630" cy="190" r="24" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/><text x="630" y="196" font-size="17" text-anchor="middle" font-weight="normal" fill="#1f1f1f">C</text><line x1="474" y1="130" x2="604" y2="98" stroke="#e15759" stroke-width="2" marker-end="url(#r)"/><line x1="474" y1="150" x2="604" y2="182" stroke="#e15759" stroke-width="2" marker-end="url(#r)"/><text x="535" y="100" font-size="16" text-anchor="middle" font-weight="normal" fill="#e15759">commit</text><text x="535" y="196" font-size="16" text-anchor="middle" font-weight="normal" fill="#e15759">abort</text><text x="540" y="240" font-size="15" text-anchor="middle" font-weight="normal" fill="#666666">B と C は違う値を正しいと信じる</text></svg>
