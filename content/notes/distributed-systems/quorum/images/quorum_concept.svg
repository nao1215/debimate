<text x="849.4349029814193" y="98.10643118126103" font-size="28" font-weight="normal" text-anchor="start">W</text>
<text x="606.6719430736" y="428.4771609537402" font-size="28" font-weight="normal" text-anchor="end">R</text>
<text x="720" y="476" font-size="26" font-weight="normal" text-anchor="middle" class="red">W + R = 4 ≤ 5　重ならない場合がある</text>
<line x1="480" y1="30" x2="480" y2="500" stroke="#666666" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
