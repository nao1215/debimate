<path d="M327.0,387.7 A148.0,148.0 0 0 1 99.2,222.3 A46.0,46.0 0 0 1 186.7,250.7 A56.0,56.0 0 0 0 272.9,313.3 A46.0,46.0 0 0 1 327.0,387.7 Z" fill="#f8eed8" stroke="#d4a24c" stroke-width="3" stroke-dasharray="9 6"/>
