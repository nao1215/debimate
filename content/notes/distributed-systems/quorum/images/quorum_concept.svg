<circle cx="650.6" cy="363.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="650.6" y="372.5" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">4</text>
<circle cx="607.8" cy="231.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
