<circle cx="832.2" cy="231.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="832.2" y="240.5" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">2</text>
<circle cx="789.4" cy="363.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
