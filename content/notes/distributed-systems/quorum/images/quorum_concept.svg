<text x="240.0" y="159.0" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">1</text>
<circle cx="352.2" cy="231.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="352.2" y="240.5" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">2</text>
<circle cx="309.4" cy="363.5" r="27" fill="#8fae86" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="309.4" y="372.5" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">3</text>
<circle cx="170.6" cy="363.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="170.6" y="372.5" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">4</text>
<circle cx="127.8" cy="231.5" r="27" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="127.8" y="240.5" font-size="26" text-anchor="middle" font-weight="normal" style="fill:#1f1f1f">5</text>
<text x="369.4349029814193" y="98.10643118126103" font-size="28" font-weight="normal" text-anchor="start">W</text>
<text x="126.6719430736" y="428.4771609537402" font-size="28" font-weight="normal" text-anchor="end">R</text>
<text x="240" y="476" font-size="26" font-weight="normal" text-anchor="middle">W + R = 6 &gt; 5　必ず重なる</text>
<text x="720" y="52" font-size="30" font-weight="normal" text-anchor="middle">W = 2、R = 2</text>
<path d="M720.0,88.0 A180.0,180.0 0 0 1 891.2,212.4 A46.0,46.0 0 0 1 803.7,240.8 A88.0,88.0 0 0 0 720.0,180.0 A46.0,46.0 0 0 1 720.0,88.0 Z" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="4"/>
