<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>W + R が N を超えると書き込みと読み取りの集合が必ず重なる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .red{fill:#e15759}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="240" y="52" font-size="30" font-weight="normal" text-anchor="middle">W = 3、R = 3</text>
