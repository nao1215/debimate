<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>fsync の失敗を再試行した場合と、止めて WAL から再生する場合</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="74" font-size="26" text-anchor="start" style="fill:#1f1f1f">再試行（2019 年 2 月より前）</text>
<rect x="40" y="104" width="190" height="120" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="135" y="156" font-size="26" text-anchor="middle" style="fill:#1f1f1f">fsync</text>
<text x="135" y="194" font-size="26" text-anchor="middle" style="fill:#1f1f1f">失敗</text>
<line x1="234" y1="164" x2="266" y2="164" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="270" y="104" width="190" height="120" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="365" y="156" font-size="26" text-anchor="middle" style="fill:#1f1f1f">OS が</text>
<text x="365" y="194" font-size="26" text-anchor="middle" style="fill:#1f1f1f">データを捨てる</text>
<line x1="464" y1="164" x2="496" y2="164" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="500" y="104" width="190" height="120" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="595" y="156" font-size="26" text-anchor="middle" style="fill:#1f1f1f">fsync</text>
<text x="595" y="194" font-size="26" text-anchor="middle" style="fill:#1f1f1f">成功</text>
<line x1="694" y1="164" x2="726" y2="164" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="730" y="104" width="190" height="120" rx="8" fill="#fbe3e3" stroke="#e15759" stroke-width="3"/>
<text x="825" y="156" font-size="26" text-anchor="middle" style="fill:#1f1f1f">書けたと</text>
<text x="825" y="194" font-size="26" text-anchor="middle" style="fill:#1f1f1f">扱う</text>
<text x="40" y="324" font-size="26" text-anchor="start" style="fill:#1f1f1f">停止（11.2 など以降）</text>
<rect x="40" y="354" width="190" height="120" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="135" y="406" font-size="26" text-anchor="middle" style="fill:#1f1f1f">fsync</text>
<text x="135" y="444" font-size="26" text-anchor="middle" style="fill:#1f1f1f">失敗</text>
<line x1="234" y1="414" x2="266" y2="414" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="270" y="354" width="190" height="120" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="365" y="406" font-size="26" text-anchor="middle" style="fill:#1f1f1f">サーバーを</text>
<text x="365" y="444" font-size="26" text-anchor="middle" style="fill:#1f1f1f">止める</text>
<line x1="464" y1="414" x2="496" y2="414" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="500" y="354" width="190" height="120" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="595" y="424" font-size="26" text-anchor="middle" style="fill:#1f1f1f">再起動</text>
<line x1="694" y1="414" x2="726" y2="414" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="730" y="354" width="190" height="120" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="825" y="406" font-size="26" text-anchor="middle" style="fill:#1f1f1f">WAL から</text>
<text x="825" y="444" font-size="26" text-anchor="middle" style="fill:#1f1f1f">再生する</text>
<line x1="40" y1="262" x2="920" y2="262" stroke="#cccccc" stroke-width="2"/>
</svg>
