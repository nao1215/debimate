<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" role="img">
<title>同じ trace ID を持つ Span が、parent span ID で木になる</title>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="20" y="20" width="920" height="500" rx="14" fill="#f2f2f2" stroke="#d0d0d0" stroke-width="2"/>
<text x="44" y="60" font-size="24" fill="#666666" text-anchor="start">Trace（全ての Span が同じ trace ID を持つ）</text>
<path d="M480.0,202 L480.0,219.0 L480.0,219.0 L480.0,232" fill="none" stroke="#666666" stroke-width="2.5"/>
<path d="M472.0,222 L480.0,234 L488.0,222" fill="none" stroke="#666666" stroke-width="2.5"/>
<path d="M480.0,354 L480.0,371.0 L280.0,371.0 L280.0,384" fill="none" stroke="#666666" stroke-width="2.5"/>
<path d="M272.0,374 L280.0,386 L288.0,374" fill="none" stroke="#666666" stroke-width="2.5"/>
<path d="M480.0,354 L480.0,371.0 L680.0,371.0 L680.0,384" fill="none" stroke="#666666" stroke-width="2.5"/>
<path d="M672.0,374 L680.0,386 L688.0,374" fill="none" stroke="#666666" stroke-width="2.5"/>
<rect x="330" y="84" width="300" height="118" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="480.0" y="120" font-size="24" fill="#1f1f1f" text-anchor="middle">gateway の Span</text>
<text x="354" y="156" font-size="24" fill="#666666" text-anchor="start">span ID: A</text>
<text x="354" y="188" font-size="24" fill="#666666" text-anchor="start">親: なし（root span）</text>
<rect x="330" y="236" width="300" height="118" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="480.0" y="272" font-size="24" fill="#1f1f1f" text-anchor="middle">orders の Span</text>
<text x="354" y="308" font-size="24" fill="#666666" text-anchor="start">span ID: B</text>
<text x="354" y="340" font-size="24" fill="#666666" text-anchor="start">親: A</text>
<rect x="130" y="388" width="300" height="118" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="280.0" y="424" font-size="24" fill="#1f1f1f" text-anchor="middle">inventory の Span</text>
<text x="154" y="460" font-size="24" fill="#666666" text-anchor="start">span ID: C</text>
<text x="154" y="492" font-size="24" fill="#666666" text-anchor="start">親: B</text>
<rect x="530" y="388" width="300" height="118" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="680.0" y="424" font-size="24" fill="#1f1f1f" text-anchor="middle">mailer の Span</text>
<text x="554" y="460" font-size="24" fill="#666666" text-anchor="start">span ID: D</text>
<text x="554" y="492" font-size="24" fill="#666666" text-anchor="start">親: B</text>
</svg>
