<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>二重書き込みと Transactional Outbox の違い</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="240" y="46" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">二重書き込み</text>
<rect x="130" y="74" width="220" height="60" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="240" y="113" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">アプリケーション</text>
<rect x="20" y="168" width="230" height="244" rx="14" fill="none" stroke="#7aa6c2" stroke-width="3" stroke-dasharray="10 7"/>
<text x="135" y="398" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">トランザクション</text>
<rect x="42" y="190" width="186" height="170" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="80" y="226" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">DB</text>
<rect x="70" y="272" width="130" height="74" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="135" y="318" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">注文</text>
<line x1="160" y1="136" x2="152" y2="268" stroke="#7aa6c2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
<rect x="290" y="264" width="160" height="82" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="370" y="314" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ブローカー</text>
<line x1="310" y1="136" x2="362" y2="258" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#arrow-ochre)"/>
<line x1="325" y1="185" x2="349" y2="209" stroke="#e15759" stroke-width="6" stroke-linecap="round"/>
<line x1="325" y1="209" x2="349" y2="185" stroke="#e15759" stroke-width="6" stroke-linecap="round"/>
<text x="240" y="456" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">送信だけが</text>
<text x="240" y="492" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">トランザクションの外</text>
<line x1="480" y1="30" x2="480" y2="510" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="730" y="46" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Transactional Outbox</text>
<rect x="620" y="74" width="220" height="60" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="730" y="113" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">アプリケーション</text>
<rect x="508" y="168" width="436" height="224" rx="14" fill="none" stroke="#7aa6c2" stroke-width="3" stroke-dasharray="10 7"/>
<text x="650" y="378" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">1 つのトランザクション</text>
<rect x="528" y="184" width="396" height="160" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="566" y="270" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">DB</text>
<rect x="610" y="222" width="140" height="80" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="680" y="271" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">注文</text>
<rect x="772" y="222" width="136" height="80" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="840" y="271" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">outbox</text>
<line x1="680" y1="136" x2="680" y2="218" stroke="#7aa6c2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
<line x1="780" y1="136" x2="830" y2="218" stroke="#7aa6c2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
<rect x="780" y="410" width="120" height="66" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="840" y="452" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">relay</text>
<rect x="560" y="410" width="160" height="66" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="640" y="452" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ブローカー</text>
<line x1="840" y1="304" x2="840" y2="404" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<line x1="778" y1="443" x2="726" y2="443" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<text x="726" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">commit の後で relay が送る</text>
</svg>
