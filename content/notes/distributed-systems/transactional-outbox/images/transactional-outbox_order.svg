<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>先に採番された A の行が、commit の遅れで B の後に発行される</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="30" y="128" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">tx A</text>
<line x1="230" y1="120" x2="930" y2="120" stroke="#dddddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="30" y="248" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">tx B</text>
<line x1="230" y1="240" x2="930" y2="240" stroke="#dddddd" stroke-width="1.5" stroke-linecap="round"/>
<text x="30" y="398" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">relay</text>
<line x1="230" y1="390" x2="930" y2="390" stroke="#dddddd" stroke-width="1.5" stroke-linecap="round"/>
<rect x="250" y="96" width="480" height="48" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="262" y="128" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">INSERT id 1</text>
<text x="742" y="128" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">COMMIT</text>
<line x1="250" y1="172" x2="730" y2="172" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
<text x="262" y="198" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">commit delayed 3 s</text>
<rect x="298.0" y="216" width="80.0" height="48" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="290.0" y="252" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">INSERT id 2</text>
<text x="390.0" y="252" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">COMMIT</text>
<line x1="506.0" y1="90" x2="506.0" y2="360" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<rect x="436.0" y="366" width="140" height="48" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="506.0" y="398" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">read</text>
<text x="506.0" y="452" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">sends 2 (B)</text>
<line x1="880.4" y1="90" x2="880.4" y2="360" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<rect x="810.4" y="366" width="140" height="48" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="880.4" y="398" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">read</text>
<text x="880.4" y="452" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">sends 1 (A)</text>
<text x="480" y="515" font-size="22" font-weight="normal" text-anchor="middle" style="fill:#666666">unsent rows are read in id order</text>
</svg>
