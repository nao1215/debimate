<text x="24" y="399" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">実行</text>
<rect x="92" y="108" width="124" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="154" y="149" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">PREPARE</text>
<rect x="238" y="236" width="64" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="318" y="236" width="64" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="398" y="236" width="64" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="478" y="236" width="64" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="558" y="236" width="64" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="430.0" y="218" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">値ごとに作る</text>
<rect x="640.0" y="236" width="290.0" height="64" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="780.0" y="277" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">保存した計画</text>
<text x="780.0" y="218" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">使い回す</text>
<circle cx="270" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="270" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1</text>
<circle cx="350" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="350" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">2</text>
<circle cx="430" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="430" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">3</text>
<circle cx="510" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="510" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">4</text>
<circle cx="590" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="590" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">5</text>
<circle cx="670" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="670" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">6</text>
<circle cx="750" cy="390" r="28" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="750" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">7</text>
<text x="824" y="399" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#666666">…</text>
<line x1="630.0" y1="92" x2="630.0" y2="430" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/>
<text x="630.0" y="72" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">6 回目で切り替わる</text>
<text x="510" y="490" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">EXECUTE の回数（generic plan の方が安く見積もられた場合）</text>
