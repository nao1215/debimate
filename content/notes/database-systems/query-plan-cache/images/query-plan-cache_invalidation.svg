<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>保存した計画を捨てる合図が出る変更と、出ない変更</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="40" y="40" width="420" height="104" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="250" y="84" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">DDL・search_path</text>
<text x="250" y="122" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">レコード数が変わる ANALYZE</text>
<line x1="250" y1="146" x2="250" y2="206" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="80" y="212" width="340" height="70" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="250" y="256" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">pg_class などを更新</text>
<line x1="250" y1="284" x2="250" y2="392" stroke="#7aa6c2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
<text x="266" y="346" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">無効化の通知</text>
<rect x="80" y="400" width="340" height="96" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="250" y="440" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">次の実行の前に</text>
<text x="250" y="476" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">計画を作り直す</text>
<rect x="500" y="40" width="420" height="104" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="710" y="84" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">値の分布だけが変わる</text>
<text x="710" y="122" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ANALYZE</text>
<line x1="710" y1="146" x2="710" y2="206" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="540" y="212" width="340" height="70" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="710" y="256" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">pg_statistic を更新</text>
<line x1="710" y1="284" x2="710" y2="340" stroke="#666666" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/>
<text x="726" y="346" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">通知なし</text>
<rect x="540" y="400" width="340" height="96" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="710" y="440" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">古い計画のまま</text>
<text x="710" y="476" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">rows=3891 の見積もり</text>
</svg>
