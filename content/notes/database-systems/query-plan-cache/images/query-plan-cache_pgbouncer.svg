<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>PgBouncer の transaction mode とプリペアドステートメント</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="40" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">1.21 より前</text>
<rect x="40" y="70" width="300" height="60" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="190" y="109" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">tx 1: Parse s1</text>
<line x1="344" y1="100" x2="426" y2="100" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="432" y="70" width="220" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="542" y="109" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">接続 A に s1</text>
<rect x="40" y="160" width="300" height="60" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="190" y="199" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">tx 2: Execute s1</text>
<line x1="344" y1="190" x2="426" y2="190" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="432" y="160" width="220" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="542" y="199" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">接続 B</text>
<line x1="656" y1="190" x2="698" y2="190" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="704" y="160" width="226" height="60" rx="8" fill="#fbe3e3" stroke="#e15759" stroke-width="3"/>
<text x="817" y="199" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">s1 が無く失敗</text>
<text x="40" y="310" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">1.21 以降（max_prepared_statements が 0 以外）</text>
<rect x="40" y="340" width="300" height="60" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="190" y="379" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">tx 1: Parse s1</text>
<line x1="344" y1="370" x2="426" y2="370" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="432" y="340" width="220" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="542" y="379" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">接続 A に s1</text>
<rect x="40" y="430" width="300" height="60" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="190" y="469" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">tx 2: Execute s1</text>
<line x1="344" y1="460" x2="426" y2="460" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="432" y="430" width="220" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="542" y="469" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">接続 B</text>
<line x1="656" y1="460" x2="698" y2="460" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="704" y="430" width="226" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="817" y="469" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">s1 を作って実行</text>
<line x1="40" y1="262" x2="920" y2="262" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
</svg>
