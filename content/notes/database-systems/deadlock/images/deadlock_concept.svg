<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>逆の順で取ると待ちが環になり、同じ順で取ると環が切れる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="240" y="72" font-size="30" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">逆の順で取る</text>
<line x1="195.0" y1="180" x2="285.0" y2="180" stroke="#7aa6c2" stroke-width="6" stroke-linecap="round"/>
<line x1="120" y1="220.0" x2="120" y2="322.0" stroke="#7aa6c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrow-blue)"/>
<line x1="195.0" y1="370" x2="285.0" y2="370" stroke="#d4a24c" stroke-width="6" stroke-linecap="round"/>
<line x1="360" y1="330.0" x2="360" y2="228.0" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrow-ochre)"/>
<rect x="45.0" y="140.0" width="150" height="80" rx="40" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="120" y="189" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">送金 A</text>
<rect x="285.0" y="330.0" width="150" height="80" rx="40" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="360" y="379" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">送金 B</text>
<rect x="285.0" y="140.0" width="150" height="80" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="360" y="189" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">口座 1</text>
<rect x="45.0" y="330.0" width="150" height="80" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="120" y="379" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">口座 2</text>
<path d="M240,230 A45,45 0 1 0 285,275" fill="none" stroke="#e15759" stroke-width="4" marker-end="url(#arrow-red)"/>
<text x="240" y="462" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#e15759">待ちが環になる</text>
<line x1="480" y1="40" x2="480" y2="480" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="720" y="72" font-size="30" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">同じ順で取る</text>
<line x1="675.0" y1="180" x2="765.0" y2="180" stroke="#7aa6c2" stroke-width="6" stroke-linecap="round"/>
<line x1="600" y1="220.0" x2="600" y2="330.0" stroke="#7aa6c2" stroke-width="6" stroke-linecap="round"/>
<line x1="840" y1="330.0" x2="840" y2="228.0" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#arrow-ochre)"/>
<rect x="525.0" y="140.0" width="150" height="80" rx="40" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="600" y="189" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">送金 A</text>
<rect x="765.0" y="330.0" width="150" height="80" rx="40" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="840" y="379" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">送金 B</text>
<rect x="765.0" y="140.0" width="150" height="80" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="840" y="189" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">口座 1</text>
<rect x="525.0" y="330.0" width="150" height="80" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="600" y="379" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">口座 2</text>
<text x="720" y="462" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">環にならない</text>
<line x1="250" y1="515" x2="310" y2="515" stroke="#666666" stroke-width="6" stroke-linecap="round"/>
<text x="322" y="523" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">ロックを保持</text>
<line x1="530" y1="515" x2="590" y2="515" stroke="#666666" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/>
<text x="602" y="523" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">解放を待つ</text>
</svg>
