<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img"><title>同じ表を行ごとに並べた場合と列ごとに並べた場合のバイトの並び</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="720" height="350" fill="#ffffff"/>
