<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>ON DELETE の指定ごとに、会員 42 を DELETE した後に残るレコード</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="480" y="46" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">会員 42 を DELETE した後</text>
<text x="122" y="104" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">NO ACTION /</text>
<text x="122" y="134" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">RESTRICT</text>
<rect x="17" y="170" width="210" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="122" y="209" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">会員 42</text>
<rect x="6" y="300" width="232" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="122" y="336" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">注文</text>
<text x="122" y="372" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">member_id=42</text>
<line x1="122" y1="298" x2="122" y2="236" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<text x="122" y="460" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#e15759">DELETE はエラー</text>
<text x="360" y="119" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">CASCADE</text>
<rect x="255" y="170" width="210" height="60" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
<text x="360" y="209" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">会員 42</text>
<rect x="244" y="300" width="232" height="90" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
<text x="360" y="354" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">注文</text>
<text x="360" y="460" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">子も消える</text>
<text x="598" y="119" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">SET NULL</text>
<rect x="493" y="170" width="210" height="60" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
<text x="598" y="209" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">会員 42</text>
<rect x="482" y="300" width="232" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="598" y="336" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">注文</text>
<text x="598" y="372" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">member_id=NULL</text>
<text x="598" y="460" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">参照だけ外れる</text>
<text x="836" y="119" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">SET DEFAULT</text>
<rect x="731" y="170" width="210" height="60" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
<text x="836" y="209" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">会員 42</text>
<rect x="720" y="300" width="232" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="836" y="336" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">注文</text>
<text x="836" y="372" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">member_id=既定値</text>
<text x="836" y="460" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">既定値に替わる</text>
</svg>
