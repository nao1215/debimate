<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>月ごとのパーティションと刈り込み・DROP</title><defs><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs><rect width="960" height="540" fill="#ffffff"/><rect x="36" y="150" width="888" height="270" rx="14" fill="none" stroke="#666666" stroke-width="3" stroke-dasharray="10 7"/><text x="480" y="400" font-size="24" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#666666">events（親表）は枠だけで、レコードを持たない</text><rect x="56" y="178" width="128" height="170" rx="3" fill="#f8eed8" stroke="#d4a24c" stroke-width="3" stroke-dasharray="9 6"/><text x="120.0" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f">1 月</text><rect x="200" y="178" width="128" height="170" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/><text x="264.0" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#666666">2 月</text><rect x="344" y="178" width="128" height="170" rx="3" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="3"/><text x="408.0" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f">3 月</text><rect x="488" y="178" width="128" height="170" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/><text x="552.0" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#666666">4 月</text><rect x="632" y="178" width="128" height="170" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/><text x="696.0" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#666666">5 月</text><rect x="776" y="178" width="128" height="170" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/><text x="840.0" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#666666">6 月</text><text x="140.0" y="66" font-size="26" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f">古い月は DROP</text><line x1="120.0" y1="82" x2="120.0" y2="170" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><text x="448.0" y="66" font-size="26" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f">3 月の条件で読む</text><line x1="408.0" y1="82" x2="408.0" y2="170" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="480" y="472" font-size="26" font-weight="normal" text-anchor="middle" style="font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#666666">ほかの月は刈り込みで読まない</text></svg>
