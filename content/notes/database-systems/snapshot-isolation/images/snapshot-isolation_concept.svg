<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>write skew: 同じ時点を読み、別々のレコードを書く 2 本</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="900" y="75" font-size="24" font-weight="normal" text-anchor="end" style="fill:#666666">時間 →</text>
<text x="90" y="190.0" font-size="30" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">x</text>
<rect x="130" y="150" width="410" height="60" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="375.0" y="189.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">50</text>
<rect x="540" y="150" width="360" height="60" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="720.0" y="189.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">-50</text>
<text x="90" y="275.0" font-size="30" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">y</text>
<rect x="130" y="235" width="610" height="60" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="475.0" y="274.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">50</text>
<rect x="740" y="235" width="160" height="60" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="820.0" y="274.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">-50</text>
<rect x="200" y="40" width="340" height="50" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="240" y="74" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">T1</text>
<rect x="280" y="355" width="460" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="320" y="389" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">T2</text>
<line x1="200" y1="90" x2="200" y2="295" stroke="#7aa6c2" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/>
<line x1="280" y1="355" x2="280" y2="150" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/>
<circle cx="200" cy="180.0" r="9" fill="#7aa6c2"/>
<circle cx="200" cy="265.0" r="9" fill="#7aa6c2"/>
<circle cx="280" cy="180.0" r="9" fill="#d4a24c"/>
<circle cx="280" cy="265.0" r="9" fill="#d4a24c"/>
<line x1="540" y1="90" x2="540" y2="144" stroke="#7aa6c2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="740" y1="355" x2="740" y2="301" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-ochre)"/>
<text x="480" y="458" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">縦線の時点で読むので、どちらも x = 50、y = 50 を見る</text>
<text x="480" y="506" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">書くレコードが違うので両方確定し、合計は <tspan style="fill:#e15759">-100</tspan></text>
</svg>
