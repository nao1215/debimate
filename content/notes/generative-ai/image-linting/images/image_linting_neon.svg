<rect width="960" height="540" fill="#ffffff"/>
<rect x="229" y="70" width="671" height="330" fill="#f2f2f2"/>
<text x="564.5454545454545" y="106" font-size="24" text-anchor="middle" class="sub">不合格にする側（2% を超える）</text>
<line x1="229" y1="70" x2="229" y2="400" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="80" y1="400" x2="900" y2="400" stroke="#1f1f1f" stroke-width="2"/>
