<line x1="825" y1="400" x2="825" y2="410" stroke="#1f1f1f" stroke-width="2"/>
<text x="825.4545454545455" y="440" font-size="24" text-anchor="middle">0.10</text>
<text x="480" y="492" font-size="24" text-anchor="middle" class="sub">彩度と明るさがともに 0.85 を超える画素の割合</text>
<circle cx="83" cy="160" r="11" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
