<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>データとして包む守りはモデルの判断に、許可リストは呼ぶ側の作りに頼る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .mono{font-family:'DejaVu Sans Mono','Noto Sans Mono',monospace}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fae86"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="20" y="70" width="180" height="120" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="110" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ツールの結果</text>
<text x="110" y="160" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">指示が紛れる</text>
<rect x="260" y="70" width="150" height="120" rx="12" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="335" y="139" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">モデル</text>
<rect x="480" y="70" width="190" height="120" rx="12" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="575" y="122" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">呼ぶ側</text>
<rect x="495" y="136" width="160" height="40" rx="6" fill="#ffffff" stroke="#d4a24c" stroke-width="2"/>
<text x="575" y="165" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">許可リスト</text>
<rect x="730" y="70" width="210" height="120" rx="12" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="835" y="120" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666" class="mono">delete_file</text>
<path d="M762,144 l22,22 M784,144 l-22,22" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<text x="798" y="165" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">実行しない</text>
<path d="M202,130 L254,130" fill="none" stroke="#1f1f1f" stroke-width="3" marker-end="url(#arrow-ink)"/>
<path d="M412,130 L474,130" fill="none" stroke="#1f1f1f" stroke-width="3" marker-end="url(#arrow-ink)"/>
<text x="443" y="116" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">要求</text>
<path d="M672,130 L724,130" fill="none" stroke="#666666" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-sub)"/>
<rect x="110" y="280" width="380" height="200" rx="12" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="300" y="325" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">データとして包む</text>
<text x="300" y="370" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">モデルが従わないかで決まる</text>
<text x="300" y="425" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">対応の課題: 30 回中 25 回</text>
<text x="300" y="460" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">が実行された</text>
<path d="M300,280 L330,196" fill="none" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="530" y="280" width="380" height="200" rx="12" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="720" y="325" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">許可リスト</text>
<text x="720" y="370" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">呼ぶ側の作りで決まる</text>
<text x="720" y="425" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">要求は 40 回中 33 回</text>
<text x="720" y="460" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">実行は 0 回</text>
<path d="M690,280 L600,196" fill="none" stroke="#d4a24c" stroke-width="2.5"/>
</svg>
