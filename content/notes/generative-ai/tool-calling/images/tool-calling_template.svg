<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>関数の定義は system の文章に、ツールの結果は user の枠に置かれる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .mono{font-family:'DejaVu Sans Mono','Noto Sans Mono',monospace}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fae86"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="30" y="20" width="180" height="74" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="120" y="66" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f" class="mono">system</text>
<rect x="225" y="20" width="705" height="74" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="250" y="66" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">&lt;tools&gt; 関数の定義 &lt;/tools&gt;</text>
<rect x="30" y="108" width="180" height="74" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="120" y="154" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f" class="mono">user</text>
<rect x="225" y="108" width="705" height="74" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="250" y="154" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">東京の今の気温は何度ですか。</text>
<rect x="30" y="196" width="180" height="74" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="120" y="242" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f" class="mono">assistant</text>
<rect x="225" y="196" width="705" height="74" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="250" y="242" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">&lt;tool_call&gt; 要求の JSON &lt;/tool_call&gt;</text>
<rect x="30" y="284" width="180" height="74" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="120" y="330" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f" class="mono">user</text>
<rect x="225" y="284" width="705" height="74" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="250" y="330" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">&lt;tool_response&gt; 結果の JSON &lt;/tool_response&gt;</text>
<rect x="30" y="372" width="180" height="74" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="120" y="418" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f" class="mono">assistant</text>
<rect x="225" y="372" width="705" height="74" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="250" y="418" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">次の返事</text>
<text x="480" y="500" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ツールの結果も、ユーザーの発言と同じ枠に並ぶ文字列</text>
</svg>
