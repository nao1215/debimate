<text x="660.0" y="490.9" font-size="24" text-anchor="middle">VAE decoder</text>
<line x1="700" y1="389" x2="660" y2="443" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="762" y1="482" x2="808" y2="482" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="810" y="425" width="130" height="95" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="875.0" y="464.9" font-size="24" text-anchor="middle">画像</text>
<text x="875.0" y="496.9" font-size="21" text-anchor="middle" class="sub">1024²</text>
