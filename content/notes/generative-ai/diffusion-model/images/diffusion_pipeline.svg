<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>SDXL で 1 枚を描く時の部品の流れ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="30" y="40" width="230" height="90" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
