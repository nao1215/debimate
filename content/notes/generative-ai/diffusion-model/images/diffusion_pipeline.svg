<rect x="190" y="275" width="260" height="110" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="320.0" y="322.4" font-size="24" text-anchor="middle">UNet</text>
<text x="320.0" y="354.4" font-size="21" text-anchor="middle" class="sub">ノイズを予測</text>
<rect x="500" y="275" width="260" height="110" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
