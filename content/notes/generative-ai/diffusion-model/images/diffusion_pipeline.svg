<line x1="262" y1="85" x2="318" y2="85" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="320" y="40" width="300" height="90" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
