<text x="470.0" y="109.4" font-size="21" text-anchor="middle" class="sub">CLIP ViT-L と bigG</text>
<line x1="470" y1="132" x2="470" y2="218" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
