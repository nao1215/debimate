<text x="150.0" y="505.2" font-size="19" text-anchor="middle" class="sub">sigma 14.6 倍</text>
<line x1="150" y1="443" x2="220" y2="389" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
