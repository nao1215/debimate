<line x1="452" y1="315" x2="498" y2="315" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="498" y1="350" x2="452" y2="350" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="445" width="260" height="75" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
