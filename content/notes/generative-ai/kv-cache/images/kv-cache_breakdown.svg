<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><title>q4_K_M の読み込み時の size を、KV キャッシュとそれ以外に分ける</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="440" fill="#ffffff"/>
<line x1="419.2" y1="78.0" x2="419.2" y2="330.0" stroke="#666666" stroke-width="2" stroke-dasharray="6 5"/>
<text x="419.2" y="64.0" font-size="24" text-anchor="middle" class="sub">ファイル 1.36 GB</text>
<text x="30.0" y="154.0" font-size="26" text-anchor="start">num_ctx 4,096</text>
<rect x="290.0" y="110.0" width="135.3" height="70.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="425.3" y="110.0" width="44.6" height="70.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="357.7" y="154.0" font-size="24" text-anchor="middle">1.42 GB</text>
<text x="483.9" y="154.0" font-size="24" text-anchor="start">計 1.89 GB（うち KV 0.47）</text>
<text x="30.0" y="284.0" font-size="26" text-anchor="start">num_ctx 未指定</text>
<text x="30.0" y="320.0" font-size="24" text-anchor="start" class="sub">（40,960 で読み込み）</text>
<rect x="290.0" y="240.0" width="143.7" height="70.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="433.7" y="240.0" width="446.3" height="70.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="361.8" y="284.0" font-size="24" text-anchor="middle">1.51 GB</text>
<text x="656.8" y="284.0" font-size="24" text-anchor="middle">KV キャッシュ 4.70 GB</text>
<text x="880.0" y="344.0" font-size="24" text-anchor="end">計 6.21 GB</text>
<rect x="290.0" y="392.0" width="28.0" height="28.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
