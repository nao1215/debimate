<rect x="540.0" y="392.0" width="28.0" height="28.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="578.0" y="414.0" font-size="24" text-anchor="start">KV キャッシュ（num_ctx 個の枠）</text>
