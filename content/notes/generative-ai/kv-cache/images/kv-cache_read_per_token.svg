<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>生成の 1 トークンごとに読む量と、実測の生成の速さ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="400" fill="#ffffff"/>
<text x="30.0" y="52.0" font-size="24" text-anchor="start" class="sub">入力の長さ</text>
<text x="250.0" y="52.0" font-size="24" text-anchor="start" class="sub">1 トークンを出すたびに読む量</text>
<text x="930.0" y="52.0" font-size="24" text-anchor="end" class="sub">実測の速さ</text>
<text x="30.0" y="128.0" font-size="26" text-anchor="start">542 トークン</text>
<rect x="250.0" y="84.0" width="150.8" height="66.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="400.8" y="84.0" width="5.0" height="66.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="325.4" y="127.0" font-size="24" text-anchor="middle">重み</text>
<text x="405.8" y="182.0" font-size="24" text-anchor="end">計 1.95 GB</text>
<text x="930.0" y="127.0" font-size="26" text-anchor="end">92.0 トークン/秒</text>
<text x="30.0" y="258.0" font-size="26" text-anchor="start">30,759 トークン</text>
<rect x="250.0" y="214.0" width="150.8" height="66.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="400.8" y="214.0" width="282.2" height="66.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="325.4" y="257.0" font-size="24" text-anchor="middle">重み</text>
<text x="541.9" y="257.0" font-size="24" text-anchor="middle">K・V 3.53</text>
<text x="683.0" y="312.0" font-size="24" text-anchor="end">計 5.41 GB</text>
<text x="930.0" y="257.0" font-size="26" text-anchor="end">38.8 トークン/秒</text>
<text x="480.0" y="372.0" font-size="24" text-anchor="middle" class="sub">読む量は約 2.8 倍、速さは約 2.4 分の 1（num_ctx 32,768、q8_0）</text>
</svg>
