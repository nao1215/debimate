# Ambassador: アプリは 127.0.0.1:6380 にだけ繋ぎ、どちらが master かは HAProxy が決める
global
    log stdout format raw local0
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 500ms
    timeout client 30s
    timeout server 30s
frontend redis_in
    bind 127.0.0.1:6380
    default_backend redis_master
backend redis_master
    option tcp-check
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server redis-a 172.28.0.11:6379 check inter 1s fall 1 rise 1
    server redis-b 172.28.0.12:6379 check inter 1s fall 1 rise 1
    server redis-c 172.28.0.13:6379 check inter 1s fall 1 rise 1
