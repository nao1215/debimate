<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>main からは localhost の 1 つの宛先だけが見え、外で書き込みと読み取りに分かれる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="30" y="40" width="550" height="460" rx="24" fill="#f2f2f2" stroke="#666666" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="54" y="82" font-size="26" font-weight="normal" text-anchor="start" style="fill:#666666">実行単位</text>
<rect x="60" y="160" width="230" height="220" rx="18" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="175" y="255" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">main</text>
<text x="175" y="292" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">アプリケーション</text>
<rect x="450" y="160" width="230" height="220" rx="18" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="580" y="280" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ambassador</text>
<line x1="292" y1="270" x2="424" y2="270" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="436" y="238" width="36" height="64" rx="4" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="360" y="250" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">localhost</text>
<text x="360" y="320" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">宛先は 1 つ</text>
<rect x="712" y="40" width="236" height="460" rx="18" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="6 6"/>
<text x="830" y="80" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">main から見えない</text>
<text x="830" y="130" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">書き込み</text>
<path d="M755.0,160 v56 a75.0,10 0 0 0 150,0 v-56" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<ellipse cx="830" cy="160" rx="75.0" ry="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="830" y="206" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">master</text>
<text x="830" y="278" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">読み取り</text>
<path d="M755.0,308 v56 a75.0,10 0 0 0 150,0 v-56" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<ellipse cx="830" cy="308" rx="75.0" ry="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="830" y="354" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">replica 1</text>
<path d="M755.0,408 v56 a75.0,10 0 0 0 150,0 v-56" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<ellipse cx="830" cy="408" rx="75.0" ry="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="830" y="454" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">replica 2</text>
<line x1="682" y1="230" x2="752" y2="186" stroke="#d4a24c" stroke-width="5" stroke-linecap="round"/>
<line x1="682" y1="300" x2="752" y2="336" stroke="#7aa6c2" stroke-width="5" stroke-linecap="round"/>
<line x1="682" y1="330" x2="752" y2="436" stroke="#7aa6c2" stroke-width="5" stroke-linecap="round"/>
</svg>
