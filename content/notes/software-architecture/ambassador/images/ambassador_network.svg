<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>ネットワークを共有すれば localhost で届き、共有しなければ相手のアドレスが要る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="242" y="58" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ネットワークを共有する</text>
<text x="242" y="94" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">Kubernetes の Pod</text>
<rect x="25" y="120" width="435" height="320" rx="20" fill="#f2f2f2" stroke="#666666" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="45" y="150" width="395" height="266" rx="14" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="242" y="196" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">IP アドレス 1 つ</text>
<rect x="58" y="250" width="160" height="96" rx="14" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="138" y="307" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">main</text>
<rect x="268" y="250" width="160" height="96" rx="14" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<text x="348" y="307" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ambassador</text>
<line x1="220" y1="298" x2="264" y2="298" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="242" y="486" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">localhost で届く</text>
<text x="717" y="58" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">共有しない</text>
<text x="717" y="94" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">ECS の bridge モード</text>
<rect x="500" y="120" width="435" height="320" rx="20" fill="#f2f2f2" stroke="#666666" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="515" y="150" width="198" height="266" rx="14" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="614" y="196" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">172.17.0.2</text>
<rect x="727" y="150" width="198" height="266" rx="14" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="826" y="196" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">172.17.0.3</text>
<rect x="534" y="250" width="160" height="96" rx="14" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="614" y="307" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">main</text>
<rect x="746" y="250" width="160" height="96" rx="14" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<text x="826" y="307" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ambassador</text>
<line x1="696" y1="298" x2="742" y2="298" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="717" y="486" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">相手のアドレスを探して持つ</text>
</svg>
