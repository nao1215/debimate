<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>アプリケーションがプロキシより先に動くと最初の通信が失敗する</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="930" y="44" font-size="24" font-weight="normal" text-anchor="end" style="fill:#666666">時間 →</text>
<text x="30" y="80" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">起動の順序を決めない</text>
<text x="30" y="133" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">プロキシ</text>
<text x="30" y="239" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">アプリケーション</text>
<rect x="240" y="104" width="360" height="42" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
<text x="420.0" y="133" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">起動中</text>
<rect x="600" y="104" width="330" height="42" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="765.0" y="133" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">準備完了</text>
<rect x="270" y="210" width="660" height="42" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<line x1="330" y1="208" x2="330" y2="154" stroke="#e15759" stroke-width="3" stroke-linecap="round"/>
<text x="344" y="188" font-size="24" font-weight="normal" text-anchor="start" style="fill:#e15759">失敗</text>
<line x1="720" y1="208" x2="720" y2="154" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="734" y="188" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">届く</text>
<text x="30" y="316" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">プロキシの準備を待つ</text>
<text x="30" y="369" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">プロキシ</text>
<text x="30" y="475" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">アプリケーション</text>
<rect x="240" y="340" width="240" height="42" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
<text x="360.0" y="369" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">起動中</text>
<rect x="480" y="340" width="450" height="42" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="705.0" y="369" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">準備完了</text>
<text x="370.0" y="475" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">待つ</text>
<rect x="500" y="446" width="430" height="42" rx="6" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<line x1="560" y1="444" x2="560" y2="390" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="574" y="424" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">届く</text>
<text x="480" y="528" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">holdApplicationUntilProxyStarts・Sidecar Containers</text>
</svg>
