<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>古い項目と新しい項目を並べて、呼ぶ側を 1 つずつ移す 3 段階</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="165" y="62" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1. 新しい項目を足す</text>
<rect x="25" y="92" width="280" height="128" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="165" y="128" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">注文 API の応答</text>
<rect x="37" y="148" width="124" height="56" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="99" y="185" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">total</text>
<rect x="169" y="148" width="124" height="56" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="231" y="185" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">新項目</text>
<rect x="65" y="262" width="200" height="54" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="165" y="298" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">決済: total</text>
<rect x="65" y="332" width="200" height="54" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="165" y="368" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">分析: total</text>
<rect x="65" y="402" width="200" height="54" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="165" y="438" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">画面: total</text>
<text x="480" y="62" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">2. 1 つずつ移す</text>
<rect x="340" y="92" width="280" height="128" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="480" y="128" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">注文 API の応答</text>
<rect x="352" y="148" width="124" height="56" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="414" y="185" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">total</text>
<rect x="484" y="148" width="124" height="56" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="546" y="185" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">新項目</text>
<rect x="380" y="262" width="200" height="54" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="480" y="298" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">決済: 新項目</text>
<rect x="380" y="332" width="200" height="54" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="480" y="368" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">分析: 新項目</text>
<rect x="380" y="402" width="200" height="54" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="480" y="438" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">画面: total</text>
<text x="795" y="62" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">3. 古い項目を消す</text>
<rect x="655" y="92" width="280" height="128" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="795" y="128" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">注文 API の応答</text>
<rect x="667" y="148" width="124" height="56" rx="8" fill="none" stroke="#bbbbbb" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="729" y="185" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">削除</text>
<rect x="799" y="148" width="124" height="56" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="861" y="185" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">新項目</text>
<rect x="695" y="262" width="200" height="54" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="795" y="298" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">決済: 新項目</text>
<rect x="695" y="332" width="200" height="54" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="795" y="368" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">分析: 新項目</text>
<rect x="695" y="402" width="200" height="54" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="795" y="438" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">画面: 新項目</text>
<line x1="315" y1="160" x2="322" y2="160" stroke="#666666" stroke-width="3" stroke-linecap="round"/>
<path d="M322,152 L334,160 L322,168 z" fill="#666666"/>
<line x1="630" y1="160" x2="637" y2="160" stroke="#666666" stroke-width="3" stroke-linecap="round"/>
<path d="M637,152 L649,160 L637,168 z" fill="#666666"/>
<text x="480" y="508" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">どの時点でも、全員が読める項目が応答に残っている</text>
</svg>
