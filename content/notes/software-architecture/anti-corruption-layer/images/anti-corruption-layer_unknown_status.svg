<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>上流が足した新しい状態コードを、ACL の 1 箇所で止めるか、各所で読むか</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="44" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">ACL がある</text>
<rect x="40" y="76" width="220" height="76" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="150" y="123" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">STS = &quot;7&quot;</text>
<line x1="266" y1="114" x2="330" y2="114" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ochre)"/>
<rect x="340" y="66" width="240" height="96" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="460" y="106" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ACL</text>
<text x="460" y="140" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">未知の値でエラー</text>
<line x1="593" y1="101" x2="619" y2="127" stroke="#e15759" stroke-width="6" stroke-linecap="round"/>
<line x1="593" y1="127" x2="619" y2="101" stroke="#e15759" stroke-width="6" stroke-linecap="round"/>
<rect x="640" y="76" width="290" height="76" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="785" y="123" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">販売のモデルに届かない</text>
<text x="40" y="244" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">ACL が無い</text>
<rect x="40" y="342" width="220" height="76" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="150" y="389" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">STS = &quot;7&quot;</text>
<path d="M266,380 C300,380 300,302 344,302" fill="none" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ochre)"/>
<rect x="352" y="270" width="220" height="64" rx="10" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<text x="462" y="311" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">注文の受付</text>
<text x="596" y="311" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">7 の意味を各所で判断</text>
<path d="M266,380 C300,380 300,394 344,394" fill="none" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ochre)"/>
<rect x="352" y="362" width="220" height="64" rx="10" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<text x="462" y="403" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">商品の一覧</text>
<text x="596" y="403" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">7 の意味を各所で判断</text>
<path d="M266,380 C300,380 300,486 344,486" fill="none" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ochre)"/>
<rect x="352" y="454" width="220" height="64" rx="10" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<text x="462" y="495" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">再入荷の通知</text>
<text x="596" y="495" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">7 の意味を各所で判断</text>
</svg>
