<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>数値から単位が落ちる受け渡しと、単位を組で持つ値</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="50" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">Mars Climate Orbiter の受け渡し（数値は例）</text>
<rect x="40" y="86" width="260" height="150" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="170" y="132" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">地上のソフトウェア</text>
<text x="170" y="172" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">ポンド秒で</text>
<text x="170" y="208" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">書き出す</text>
<line x1="306" y1="161" x2="372" y2="161" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<rect x="380" y="106" width="200" height="110" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="480" y="146" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">ファイル</text>
<text x="480" y="196" font-size="34" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">100</text>
<line x1="586" y1="161" x2="652" y2="161" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<rect x="660" y="86" width="260" height="150" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="790" y="132" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">軌道の計算</text>
<text x="790" y="172" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">ニュートン秒</text>
<text x="790" y="208" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">として読む</text>
<text x="480" y="280" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">100 ポンド秒は約 445 ニュートン秒。ファイルに単位は無い</text>
<line x1="40" y1="322" x2="920" y2="322" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="40" y="376" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">Value Object にした金額</text>
<rect x="250" y="404" width="460" height="92" rx="12" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="282" y="436" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">Money</text>
<rect x="282" y="446" width="190" height="40" rx="6" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="377" y="474" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">amount 1999</text>
<rect x="488" y="446" width="190" height="40" rx="6" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="583" y="474" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">currency JPY</text>
<text x="760" y="460" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">組のまま渡る</text>
</svg>
