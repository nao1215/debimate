<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>ChronologyProtector が複製の追い付きを待つ様子</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="24" y="179" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">primary</text>
<line x1="170" y1="170" x2="930" y2="170" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="24" y="309" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">複製</text>
<line x1="170" y1="300" x2="930" y2="300" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="24" y="439" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">ユーザー</text>
<line x1="170" y1="430" x2="930" y2="430" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<line x1="240" y1="418" x2="240" y2="184" stroke="#666666" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="240" cy="170" r="11" fill="#7aa6c2"/>
<text x="220" y="140" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">書いた位置 P を記録</text>
<text x="240" y="480" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">① 編集を保存</text>
<rect x="240" y="288" width="330" height="24" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="405" y="274" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">複製の遅れ</text>
<circle cx="570" cy="300" r="11" fill="#7aa6c2"/>
<text x="590" y="309" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">P に追い付く</text>
<line x1="430" y1="430" x2="560" y2="430" stroke="#d4a24c" stroke-width="6" stroke-dasharray="10 8"/>
<text x="495" y="412" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">待つ</text>
<line x1="570" y1="418" x2="570" y2="316" stroke="#666666" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="430" y="480" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">② 履歴を開く</text>
<text x="592" y="412" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">新しい編集が出る</text>
<circle cx="240" cy="430" r="8" fill="#666666"/>
<circle cx="430" cy="430" r="8" fill="#666666"/>
<text x="480" y="50" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">同じユーザーの約 10 秒以内の要求だけが待つ</text>
<text x="480" y="528" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">数秒で追い付かなければ打ち切り、古い値を返す</text>
</svg>
