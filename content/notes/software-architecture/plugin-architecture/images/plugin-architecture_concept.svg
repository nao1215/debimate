<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>if を足す形ではコアが伸び、境界で受ける形では拡張だけが増える</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<line x1="470" y1="30" x2="470" y2="510" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="240" y="52" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">コアに if を足す形</text>
<rect x="100" y="80" width="280" height="430" rx="16" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="240" y="120" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">コア</text>
<rect x="125" y="142" width="230" height="64" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="240" y="183" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">if ES</text>
<rect x="125" y="224" width="230" height="64" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="240" y="265" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">if S3</text>
<rect x="125" y="306" width="230" height="64" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="240" y="347" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">if stdout</text>
<rect x="125" y="388" width="230" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3.5"/>
<text x="240" y="429" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">if 新しい宛先</text>
<line x1="404" y1="92" x2="404" y2="498" stroke="#d4a24c" stroke-width="4" stroke-linecap="round"/>
<line x1="394" y1="92" x2="414" y2="92" stroke="#d4a24c" stroke-width="4" stroke-linecap="round"/>
<line x1="394" y1="498" x2="414" y2="498" stroke="#d4a24c" stroke-width="4" stroke-linecap="round"/>
<text x="438" y="295" font-size="24" text-anchor="middle" writing-mode="tb" style="fill:#666666">宛先ごとに伸びる</text>
<text x="712" y="52" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">境界で受ける形</text>
<rect x="505" y="160" width="170" height="260" rx="16" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="580.0" y="299.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">コア</text>
<text x="675" y="142" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">境界</text>
<rect x="661" y="180" width="28" height="40" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<line x1="689" y1="200" x2="740" y2="200" stroke="#666666" stroke-width="4" stroke-linecap="round"/>
<rect x="740" y="178" width="190" height="44" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<text x="835" y="209" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ES 拡張</text>
<rect x="661" y="240" width="28" height="40" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<line x1="689" y1="260" x2="740" y2="260" stroke="#666666" stroke-width="4" stroke-linecap="round"/>
<rect x="740" y="238" width="190" height="44" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<text x="835" y="269" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">S3 拡張</text>
<rect x="661" y="300" width="28" height="40" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<line x1="689" y1="320" x2="740" y2="320" stroke="#666666" stroke-width="4" stroke-linecap="round"/>
<rect x="740" y="298" width="190" height="44" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<text x="835" y="329" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">stdout 拡張</text>
<rect x="661" y="360" width="28" height="40" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<rect x="760" y="358" width="170" height="44" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3.5"/>
<text x="845" y="389" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">新しい宛先</text>
<line x1="758" y1="380" x2="697" y2="380" stroke="#7aa6c2" stroke-width="4" stroke-linecap="round"/>
<polygon points="691,380 709,370 709,390" fill="#7aa6c2"/>
<text x="712" y="470" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">コアの大きさは変わらない</text>
</svg>
