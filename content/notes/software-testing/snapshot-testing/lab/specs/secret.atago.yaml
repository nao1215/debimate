version: "1"
suite:
  name: secret
secrets: [API_TOKEN]
scenarios:
  - name: a token printed with a color reset in the middle
    env:
      API_TOKEN: s3cr3t-token
    steps:
      - run:
          shell: true
          command: |
            printf 'token: s3cr3t-\033[0mtoken\n'
      - assert:
          stdout:
            snapshot: snapshots/secret.txt
