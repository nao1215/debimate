<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" role="img"><title>アクセス行列の列と行</title>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="520" y="108" width="150" height="306" rx="10" fill="#f8eed8" stroke="none"/>
  <rect x="32" y="266" width="690" height="86" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="5"/>
  <rect x="520" y="108" width="150" height="306" rx="10" fill="none" stroke="#d4a24c" stroke-width="5"/>
  <line x1="220" y1="116" x2="220" y2="352" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="370" y1="116" x2="370" y2="352" stroke="#bdbdbd" stroke-width="2"/>
  <line x1="520" y1="116" x2="520" y2="352" stroke="#bdbdbd" stroke-width="2"/>
