  <text x="230" y="58" font-size="24" fill="#666666" text-anchor="start" font-weight="normal">行は主体、列は対象</text>
  <text x="130.0" y="156" font-size="24" fill="#666666" text-anchor="middle" font-weight="normal">主体＼対象</text>
  <text x="295.0" y="158" font-size="26" fill="#1f1f1f" text-anchor="middle" font-weight="normal">debug.txt</text>
  <text x="445.0" y="158" font-size="26" fill="#1f1f1f" text-anchor="middle" font-weight="normal">STAT</text>
  <text x="595.0" y="158" font-size="26" fill="#1f1f1f" text-anchor="middle" font-weight="normal">BILL</text>
  <text x="130.0" y="232.0" font-size="26" fill="#1f1f1f" text-anchor="middle" font-weight="normal">alice</text>
  <text x="295.0" y="232.0" font-size="24" fill="#1f1f1f" text-anchor="middle" font-weight="normal">読み書き</text>
  <text x="445.0" y="232.0" font-size="24" fill="#666666" text-anchor="middle" font-weight="normal">なし</text>
  <text x="595.0" y="232.0" font-size="24" fill="#666666" text-anchor="middle" font-weight="normal">なし</text>
  <text x="130.0" y="318.0" font-size="26" fill="#1f1f1f" text-anchor="middle" font-weight="normal">コンパイラ</text>
  <text x="295.0" y="318.0" font-size="24" fill="#666666" text-anchor="middle" font-weight="normal">なし</text>
  <text x="445.0" y="318.0" font-size="24" fill="#1f1f1f" text-anchor="middle" font-weight="normal">書き込み</text>
  <text x="595.0" y="318.0" font-size="24" fill="#1f1f1f" text-anchor="middle" font-weight="normal">書き込み</text>
  <text x="595.0" y="456" font-size="28" fill="#1f1f1f" text-anchor="middle" font-weight="normal">列 = ACL</text>
  <text x="595.0" y="494" font-size="24" fill="#666666" text-anchor="middle" font-weight="normal">対象が持つ</text>
  <text x="734" y="304" font-size="28" fill="#1f1f1f" text-anchor="start" font-weight="normal">行 = capability</text>
  <text x="734" y="340" font-size="24" fill="#666666" text-anchor="start" font-weight="normal">主体が持つ</text>
