<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>署名の対象は authenticatorData と clientDataJSON のハッシュを繋いだ値</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<text x="40" y="66" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">authenticatorData（Authenticator が作る）</text>
<rect x="40" y="86" width="320" height="84" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="200.0" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">RP ID のハッシュ</text>
<text x="200.0" y="156" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">32 バイト</text>
<rect x="360" y="86" width="160" height="84" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="440.0" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">フラグ</text>
<text x="440.0" y="156" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">1 バイト</text>
<rect x="520" y="86" width="170" height="84" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="605.0" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">signCount</text>
<text x="605.0" y="156" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">4 バイト</text>
<text x="825" y="66" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">clientDataJSON</text>
<rect x="730" y="86" width="190" height="84" rx="0" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="825" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ハッシュ</text>
<text x="825" y="156" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">32 バイト</text>
<text x="710" y="140" font-size="30" font-weight="normal" text-anchor="middle" style="fill:#666666">+</text>
<line x1="360" y1="172" x2="270" y2="236" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<line x1="520" y1="172" x2="610" y2="236" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<rect x="270" y="236" width="85" height="56" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="312.5" y="273" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">UP</text>
<rect x="355" y="236" width="85" height="56" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="397.5" y="273" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">UV</text>
<rect x="440" y="236" width="85" height="56" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="482.5" y="273" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">BE</text>
<rect x="525" y="236" width="85" height="56" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="567.5" y="273" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">BS</text>
<text x="440" y="326" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">利用者の確認とバックアップなど</text>
<line x1="825" y1="172" x2="825" y2="214" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<rect x="730" y="214" width="190" height="128" rx="10" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="825" y="250" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">type</text>
<text x="825" y="286" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">challenge</text>
<text x="825" y="322" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">origin</text>
<line x1="40" y1="382" x2="920" y2="382" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<line x1="40" y1="370" x2="40" y2="382" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<line x1="920" y1="370" x2="920" y2="382" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<line x1="480" y1="384" x2="480" y2="420" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowS)"/>
<rect x="300" y="426" width="360" height="64" rx="10" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="480" y="467" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">秘密鍵で署名 → signature</text>
<text x="480" y="524" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">どこを書き換えても署名の検証に失敗する</text>
</svg>
