<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>アカウントに入る扉と、その強さ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="40" y="20" width="880" height="70" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="480" y="66" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">アカウント</text>
<rect x="40" y="120" width="880" height="270" rx="0" fill="#f2f2f2" stroke="none" stroke-width="2.5"/>
<text x="150" y="160" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">通常のログイン</text>
<text x="590" y="160" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">復旧の経路</text>
<line x1="295" y1="176" x2="885" y2="176" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<rect x="75.0" y="196" width="150" height="194" rx="0" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="6"/>
<circle cx="203.0" cy="340" r="6" fill="#1f1f1f"/>
<text x="150" y="301.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Passkey</text>
<rect x="295.0" y="196" width="150" height="194" rx="0" fill="#ffffff" stroke="#666666" stroke-width="3"/>
<circle cx="423.0" cy="340" r="6" fill="#666666"/>
<text x="370" y="285.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">メールの</text>
<text x="370" y="317.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">コード</text>
<rect x="515.0" y="196" width="150" height="194" rx="0" fill="#ffffff" stroke="#d4a24c" stroke-width="4"/>
<polygon points="515.0,196 549.0,218 549.0,404 515.0,390" fill="#d4a24c" stroke="none" stroke-width="2.5"/>
<text x="606" y="285.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">秘密の</text>
<text x="606" y="317.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">質問</text>
<rect x="735.0" y="196" width="150" height="194" rx="0" fill="#ffffff" stroke="#d4a24c" stroke-width="4"/>
<polygon points="735.0,196 769.0,218 769.0,404 735.0,390" fill="#d4a24c" stroke="none" stroke-width="2.5"/>
<text x="826" y="285.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">サポート</text>
<text x="826" y="317.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">窓口</text>
<line x1="30" y1="390" x2="930" y2="390" stroke="#666666" stroke-width="3" stroke-linecap="round"/>
<text x="850" y="515" font-size="26" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">攻撃者</text>
<line x1="870" y1="500" x2="870" y2="354" stroke="#e15759" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="458" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">アカウントの強さは</text>
<text x="60" y="500" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">最も弱い扉で決まる</text>
</svg>
