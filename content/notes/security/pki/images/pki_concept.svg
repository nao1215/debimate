<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>trust store から証明書をたどる検証と、拒否される箇所</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="20" y="170" width="250" height="200" rx="14" fill="none" stroke="#7aa6c2" stroke-width="3" stroke-dasharray="10 7"/>
<text x="145" y="154" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">trust store（端末）</text>
<rect x="50" y="230" width="190" height="84" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="145" y="281" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Root CA</text>
<rect x="310" y="170" width="630" height="200" rx="14" fill="#f2f2f2" stroke="none" stroke-width="0"/>
<text x="332" y="350" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">サーバーが送る</text>
<rect x="340" y="230" width="210" height="84" rx="10" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<text x="445" y="281" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Intermediate</text>
<rect x="660" y="210" width="260" height="124" rx="10" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<text x="790" y="260" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">example.test</text>
<text x="790" y="300" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">サーバー証明書</text>
<line x1="240" y1="272" x2="334" y2="272" stroke="#7aa6c2" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowA)"/>
<text x="287" y="258" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">署名</text>
<line x1="550" y1="272" x2="654" y2="272" stroke="#7aa6c2" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowA)"/>
<text x="602" y="258" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">署名</text>
<rect x="660" y="30" width="260" height="70" rx="10" fill="#ffffff" stroke="#666666" stroke-width="3" stroke-dasharray="8 6"/>
<text x="790" y="74" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">evil.example.test</text>
<line x1="790" y1="208" x2="790" y2="108" stroke="#666666" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrowS)"/>
<line x1="775" y1="125" x2="805" y2="155" stroke="#e15759" stroke-width="6" stroke-linecap="round"/>
<line x1="775" y1="155" x2="805" y2="125" stroke="#e15759" stroke-width="6" stroke-linecap="round"/>
<text x="640" y="150" font-size="24" font-weight="normal" text-anchor="end" style="fill:#e15759">CA ではない</text>
<rect x="666" y="410" width="76" height="52" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="704" y="445" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">名前</text>
<line x1="704" y1="334" x2="704" y2="408" stroke="#d4a24c" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
<rect x="754" y="410" width="76" height="52" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="792" y="445" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">期限</text>
<line x1="792" y1="334" x2="792" y2="408" stroke="#d4a24c" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
<rect x="842" y="410" width="76" height="52" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="880" y="445" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">用途</text>
<line x1="880" y1="334" x2="880" y2="408" stroke="#d4a24c" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
<text x="640" y="445" font-size="24" font-weight="normal" text-anchor="end" style="fill:#666666">外れたら拒否</text>
</svg>
