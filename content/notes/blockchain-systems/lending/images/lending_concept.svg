<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>担保 10 ETH と借入 12,000 USDC。ETH の価格が下がり、担保の 80% の線が借入を下回ると清算される</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="170" y="56" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1 ETH = 2,000 ドル</text>
<rect x="55" y="100.0" width="105" height="300.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="180" y="220.0" width="105" height="180.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<line x1="35" y1="160.0" x2="305" y2="160.0" stroke="#666666" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 7"/>
<line x1="30" y1="400" x2="310" y2="400" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="170" y="444" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">HF 1.33</text>
<text x="480" y="56" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1 ETH = 1,600 ドル</text>
<rect x="365" y="160.0" width="105" height="240.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="490" y="220.0" width="105" height="180.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<line x1="345" y1="208.0" x2="615" y2="208.0" stroke="#666666" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 7"/>
<line x1="340" y1="400" x2="620" y2="400" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="480" y="444" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">HF 1.07</text>
<text x="790" y="56" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1 ETH = 1,400 ドル</text>
<rect x="675" y="190.0" width="105" height="210.0" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<rect x="800" y="220.0" width="105" height="180.0" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<line x1="655" y1="232.0" x2="925" y2="232.0" stroke="#666666" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 7"/>
<line x1="650" y1="400" x2="930" y2="400" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<circle cx="852" cy="218.0" r="18" fill="#e15759" stroke="none" stroke-width="2.5"/>
<text x="852" y="227.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#ffffff">×</text>
<text x="790" y="444" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#e15759">HF 0.93</text>
<rect x="150" y="478" width="28" height="22" rx="3" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="186" y="498" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">担保の価値</text>
<rect x="370" y="478" width="28" height="22" rx="3" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="406" y="498" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">借入</text>
<line x1="520" y1="489" x2="570" y2="489" stroke="#666666" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 7"/>
<text x="582" y="498" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">清算の線（担保の 80%）</text>
</svg>
