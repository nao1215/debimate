<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>運営者のサーバーだけが実行する構成と、各ノードが同じ取引を独立に実行する構成</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="30" y="52" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">通常の Web サービス</text>
<text x="200" y="117" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">運営者のサーバー</text>
<line x1="330" y1="108" x2="590" y2="108" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="220" y="77.0" width="110" height="62" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="275" y="117" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">前の状態</text>
<rect x="358" y="82" width="52" height="52" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="384" y="117" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">1</text>
<rect x="428" y="82" width="52" height="52" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="454" y="117" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">2</text>
<rect x="498" y="82" width="52" height="52" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="524" y="117" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">3</text>
<rect x="595" y="77.0" width="110" height="62" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="650" y="117" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">後の状態</text>
<text x="730" y="117" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">運営者だけが計算</text>
<line x1="30" y1="170" x2="930" y2="170" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="30" y="218" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">スマートコントラクト</text>
<text x="453" y="218" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">同じ取引の並び</text>
<text x="200" y="291" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">ノード A</text>
