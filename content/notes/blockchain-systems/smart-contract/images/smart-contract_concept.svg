<line x1="330" y1="372" x2="590" y2="372" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="220" y="341.0" width="110" height="62" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="275" y="381" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">前の状態</text>
<rect x="358" y="346" width="52" height="52" rx="6" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="384" y="381" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1</text>
<rect x="428" y="346" width="52" height="52" rx="6" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="454" y="381" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">2</text>
<rect x="498" y="346" width="52" height="52" rx="6" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="524" y="381" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">3</text>
<rect x="595" y="341.0" width="110" height="62" rx="8" fill="#e9f1e6" stroke="#8fae86" stroke-width="2.5"/>
<text x="650" y="381" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">後の状態</text>
<text x="200" y="471" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">ノード C</text>
<line x1="330" y1="462" x2="590" y2="462" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<rect x="220" y="431.0" width="110" height="62" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="275" y="471" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">前の状態</text>
<rect x="358" y="436" width="52" height="52" rx="6" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="384" y="471" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1</text>
<rect x="428" y="436" width="52" height="52" rx="6" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="454" y="471" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">2</text>
<rect x="498" y="436" width="52" height="52" rx="6" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="524" y="471" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">3</text>
<rect x="595" y="431.0" width="110" height="62" rx="8" fill="#e9f1e6" stroke="#8fae86" stroke-width="2.5"/>
<text x="650" y="471" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">後の状態</text>
<rect x="583" y="236" width="134" height="272" rx="12" fill="none" stroke="#8fae86" stroke-width="3" stroke-dasharray="10 7"/>
<text x="735" y="362" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">全員が同じ</text>
<text x="735" y="396" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">状態に至る</text>
</svg>
