<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>大きさの違う入力が、どれも 32 バイトのハッシュ値になる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="465" y="40" width="140" height="480" rx="14" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="535" y="290" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">SHA-256</text>
<rect x="356" y="85.0" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="60" y="101" font-size="28" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">1 文字</text>
<line x1="380" y1="92" x2="455.0" y2="92.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="615" y1="92" x2="682.0" y2="92.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="690" y="58" width="200" height="68" rx="8" fill="#e9f1e6" stroke="#8fae86" stroke-width="3"/>
<text x="790" y="101" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">32 バイト</text>
<rect x="274" y="152.0" width="96" height="96" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="60" y="209" font-size="28" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">数 MB</text>
<line x1="380" y1="200" x2="455.0" y2="200.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="615" y1="200" x2="682.0" y2="200.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="690" y="166" width="200" height="68" rx="8" fill="#e9f1e6" stroke="#8fae86" stroke-width="3"/>
<text x="790" y="209" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">32 バイト</text>
<rect x="134" y="274.0" width="236" height="236" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="252.0" y="401" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">数 GB</text>
<line x1="380" y1="392" x2="455.0" y2="392.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="615" y1="392" x2="682.0" y2="392.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="690" y="358" width="200" height="68" rx="8" fill="#e9f1e6" stroke="#8fae86" stroke-width="3"/>
<text x="790" y="401" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">32 バイト</text>
<text x="790" y="495" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#666666">どれも同じ長さ</text>
<text x="60" y="34" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">入力の大きさは模式</text>
</svg>
