<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>価格フィードが更新される 2 つの条件と、利用側が見る経過時間</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<line x1="90" y1="50" x2="140" y2="50" stroke="#666666" stroke-width="3" stroke-linecap="round"/>
<text x="150" y="58" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">市場</text>
<line x1="260" y1="50" x2="310" y2="50" stroke="#7aa6c2" stroke-width="6" stroke-linecap="round"/>
<text x="320" y="58" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">保存された価格</text>
<polyline points="80,205 150,195 220,208 290,198 360,204 430,196 500,206 560,200 600,250 640,300 700,296 780,304 900,300" fill="none" stroke="#666666" stroke-width="3"/>
<polyline points="80,200 650,200 650,300 900,300" fill="none" stroke="#7aa6c2" stroke-width="6"/>
<circle cx="330" cy="200" r="11" fill="#f8eed8" stroke="#d4a24c" stroke-width="4"/>
<circle cx="650" cy="300" r="11" fill="#f8eed8" stroke="#d4a24c" stroke-width="4"/>
<text x="330" y="160" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">heartbeat に達した</text>
<text x="330" y="245" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">（値が同じでも更新）</text>
<text x="700" y="160" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ずれが閾値を超えた</text>
<text x="650" y="430" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">updatedAt</text>
<line x1="80" y1="390" x2="905" y2="390" stroke="#666666" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<text x="905" y="375" font-size="24" font-weight="normal" text-anchor="end" style="fill:#666666">時間</text>
<line x1="650" y1="380" x2="650" y2="400" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
<line x1="880" y1="380" x2="880" y2="400" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
<text x="880" y="430" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">現在</text>
<line x1="650" y1="445" x2="880" y2="445" stroke="#d4a24c" stroke-width="4" stroke-linecap="round"/>
<line x1="650" y1="435" x2="650" y2="455" stroke="#d4a24c" stroke-width="4" stroke-linecap="round"/>
<line x1="880" y1="435" x2="880" y2="455" stroke="#d4a24c" stroke-width="4" stroke-linecap="round"/>
<text x="560" y="452" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">経過時間</text>
<text x="480" y="510" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">経過時間がアプリの許容時間以内かを利用側で判定する</text>
</svg>
