<text x="210.0" y="159" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ルート</text>
<text x="360" y="450" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">計算上の複製</text>
<text x="710" y="70" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">無効なブロック（4 件）</text>
<line x1="570.0" y1="295" x2="520" y2="365" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
