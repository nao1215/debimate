<rect x="15" y="365" width="90" height="50" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="60" y="399" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Tx0</text>
