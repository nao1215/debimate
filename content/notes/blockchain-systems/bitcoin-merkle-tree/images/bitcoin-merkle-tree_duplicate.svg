<text x="720" y="399" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Tx2</text>
<rect x="775" y="365" width="90" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="820" y="399" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Tx2</text>
<rect x="525.0" y="245" width="90" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="570.0" y="279" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">H01</text>
<rect x="725.0" y="245" width="90" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="770.0" y="279" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">H22</text>
<rect x="610.0" y="125" width="120" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="670.0" y="159" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">ルート</text>
<text x="480" y="162" font-size="40" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">=</text>
<text x="480" y="202" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">同じ値</text>
<rect x="668" y="354" width="204" height="72" rx="8" fill="none" stroke="#e15759" stroke-width="3" stroke-dasharray="8 6"/>
<text x="770.0" y="466" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">組の 2 つが同じ</text>
<text x="770.0" y="500" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#e15759">→ 棄却</text>
</svg>
