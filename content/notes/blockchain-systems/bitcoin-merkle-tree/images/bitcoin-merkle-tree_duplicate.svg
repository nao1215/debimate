<line x1="770.0" y1="295" x2="820" y2="365" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<line x1="670.0" y1="175" x2="770.0" y2="245" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<rect x="475" y="365" width="90" height="50" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
