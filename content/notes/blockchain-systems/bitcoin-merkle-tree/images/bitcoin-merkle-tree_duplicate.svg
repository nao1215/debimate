<text x="360" y="399" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">Tx2</text>
<rect x="65.0" y="245" width="90" height="50" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="110.0" y="279" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">H01</text>
<rect x="265.0" y="245" width="90" height="50" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="310.0" y="279" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">H22</text>
