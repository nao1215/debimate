<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>64 バイトの取引は葉としても内部ノードとしても読める</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="240" y="62" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">葉として読む</text>
<rect x="70" y="110" width="340" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="240" y="149" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">txid</text>
<line x1="240" y1="250" x2="240" y2="178" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<text x="254" y="222" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">二重 SHA-256</text>
<rect x="50" y="260" width="380" height="70" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="240" y="304" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">取引 T（64 バイト）</text>
<text x="240" y="380" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">ブロックに入った本物の取引</text>
<text x="720" y="62" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">内部ノードとして読む</text>
<rect x="550" y="110" width="340" height="60" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="720" y="149" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">内部ノードのハッシュ</text>
<line x1="720" y1="250" x2="720" y2="178" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<text x="734" y="222" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">二重 SHA-256</text>
<rect x="530" y="260" width="380" height="70" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<line x1="720" y1="260" x2="720" y2="330" stroke="#d4a24c" stroke-width="2.5" stroke-linecap="round"/>
<text x="625" y="304" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">左 32 バイト</text>
<text x="815" y="304" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">右 32 バイト</text>
<rect x="715" y="430" width="200" height="60" rx="8" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="815" y="469" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">偽の取引</text>
<line x1="815" y1="428" x2="815" y2="338" stroke="#d4a24c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<text x="800" y="395" font-size="24" font-weight="normal" text-anchor="end" style="fill:#666666">ハッシュが一致</text>
<text x="480" y="149" font-size="40" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">=</text>
<text x="480" y="200" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">同じ値</text>
</svg>
