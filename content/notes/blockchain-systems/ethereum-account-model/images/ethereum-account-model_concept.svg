<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Alice から Bob への送金で世界状態のどの欄が変わるか</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="480" y="56" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Alice から Bob に 1 ETH を送る取引（nonce 7）</text>
<text x="120.0" y="123" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">アドレス</text>
<text x="280.0" y="123" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">nonce</text>
<text x="480.0" y="123" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">balance（ETH）</text>
<text x="685.0" y="123" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">storageRoot</text>
<text x="845.0" y="123" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">codeHash</text>
<line x1="35" y1="140" x2="925" y2="140" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="120" y="186" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Alice</text>
<text x="120" y="218" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">EOA</text>
<rect x="211" y="150" width="138" height="84" rx="8" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="280.0" y="201.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">7 → 8</text>
<rect x="361" y="150" width="238" height="84" rx="8" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="480.0" y="201.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">5 → 4 − 手数料</text>
<rect x="611" y="150" width="148" height="84" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="685.0" y="201.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">空</text>
<rect x="771" y="150" width="148" height="84" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="845.0" y="201.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">空</text>
<text x="120" y="280" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Bob</text>
<text x="120" y="312" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">EOA</text>
<rect x="211" y="244" width="138" height="84" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="280.0" y="295.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">0</text>
<rect x="361" y="244" width="238" height="84" rx="8" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="480.0" y="295.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">2 → 3</text>
<rect x="611" y="244" width="148" height="84" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="685.0" y="295.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">空</text>
<rect x="771" y="244" width="148" height="84" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="845.0" y="295.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">空</text>
<text x="120" y="374" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">トークン</text>
<text x="120" y="406" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">コントラクト</text>
<rect x="211" y="338" width="138" height="84" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="280.0" y="389.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1</text>
<rect x="361" y="338" width="238" height="84" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="480.0" y="389.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">0</text>
<rect x="611" y="338" width="148" height="84" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="685.0" y="389.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">記憶領域</text>
<rect x="771" y="338" width="148" height="84" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="845.0" y="389.0" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">コード</text>
<rect x="60" y="460" width="30" height="30" rx="4" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2"/>
<text x="104" y="482" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">この取引で変わる欄</text>
<rect x="370" y="460" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="414" y="482" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">EOA では空のまま</text>
<rect x="640" y="460" width="30" height="30" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="684" y="482" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">コントラクトが使う</text>
</svg>
