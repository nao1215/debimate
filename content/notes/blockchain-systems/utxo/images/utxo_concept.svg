<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>取引が UTXO を丸ごと消費し、宛先とお釣りの出力を作る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="145" y="60" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">取引 1 の出力</text>
<text x="145" y="96" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#666666">使用済み</text>
<circle cx="145" cy="280" r="110.0" fill="#f2f2f2" stroke="#666666" stroke-width="3" stroke-dasharray="10 7"/>
<text x="145" y="272" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Alice</text>
<text x="145" y="308" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">1.0 BTC</text>
<rect x="325" y="165" width="150" height="230" rx="14" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="400" y="274" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">取引 2</text>
<text x="400" y="310" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">丸ごと消費</text>
<line x1="263.0" y1="280" x2="315.0" y2="280.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="700" y="60" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">取引 2 の出力</text>
<text x="700" y="96" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#666666">未使用（UTXO）</text>
<circle cx="640" cy="180" r="60.2" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="3"/>
<line x1="483" y1="250.0" x2="569.8" y2="190.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="716.2494813255682" y="174" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Bob</text>
<text x="716.2494813255682" y="206" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">0.3 BTC</text>
<circle cx="640" cy="345" r="91.4" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="3"/>
<line x1="483" y1="299.5" x2="538.6" y2="338.5" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="747.3728624920989" y="339" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Alice のお釣り</text>
<text x="747.3728624920989" y="371" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">0.69 BTC</text>
<circle cx="640" cy="488" r="11.0" fill="#d4a24c" stroke="#d4a24c" stroke-width="3"/>
<line x1="460" y1="403" x2="619.0" y2="484.0" stroke="#d4a24c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="667.0" y="497" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">差額 0.01 BTC は手数料</text>
<text x="145" y="488" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">円の面積 = 金額</text>
</svg>
