<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>同じ 3 つの slot を、V1 と先頭に fee を足した V2Bad が別の意味で読む</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="160" y="70" font-size="24" text-anchor="middle" class="sub">V1 reads</text>
<text x="480" y="70" font-size="24" text-anchor="middle" class="sub">proxy storage</text>
<text x="810" y="70" font-size="24" text-anchor="middle" class="sub">V2Bad reads</text>
<rect x="375" y="110" width="210" height="76" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
<text x="480" y="142" font-size="22" text-anchor="middle" class="sub">slot 0</text>
<text x="480" y="172" font-size="24" text-anchor="middle">0x7099…79c8</text>
<rect x="10" y="118" width="300" height="60" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="160" y="156" font-size="24" text-anchor="middle">owner = 0x7099…79c8</text>
<rect x="680" y="118" width="270" height="60" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="815" y="156" font-size="24" text-anchor="middle">fee = 6.43 × 10^47</text>
<line x1="310" y1="148" x2="375" y2="148" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="585" y1="148" x2="680" y2="148" stroke="#d4a24c" stroke-width="2.5"/>
<rect x="375" y="230" width="210" height="76" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
<text x="480" y="262" font-size="22" text-anchor="middle" class="sub">slot 1</text>
<text x="480" y="292" font-size="24" text-anchor="middle">0x…64</text>
<rect x="10" y="238" width="300" height="60" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="160" y="276" font-size="24" text-anchor="middle">balance = 100</text>
<rect x="680" y="238" width="270" height="60" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="815" y="276" font-size="24" text-anchor="middle">owner = 0x…0064</text>
<line x1="310" y1="268" x2="375" y2="268" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="585" y1="268" x2="680" y2="268" stroke="#d4a24c" stroke-width="2.5"/>
<rect x="375" y="350" width="210" height="76" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
<text x="480" y="382" font-size="22" text-anchor="middle" class="sub">slot 2</text>
<text x="480" y="412" font-size="24" text-anchor="middle">0</text>
<rect x="10" y="358" width="300" height="60" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="160" y="396" font-size="24" text-anchor="middle">(unused)</text>
<rect x="680" y="358" width="270" height="60" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="815" y="396" font-size="24" text-anchor="middle">balance = 0</text>
<line x1="310" y1="388" x2="375" y2="388" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="585" y1="388" x2="680" y2="388" stroke="#d4a24c" stroke-width="2.5"/>
<text x="480" y="500" font-size="24" text-anchor="middle" class="sub">upgrade changes only the code; the values in the slots stay</text>
</svg>
