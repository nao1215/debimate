<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>slot の空間で、変数は小さい番号に集まり、ERC-1967 の slot はハッシュから 1 を引いた場所にある</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="60" y="132" width="840" height="36" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
<text x="60" y="116" font-size="22" text-anchor="start" class="sub">0</text>
<text x="900" y="116" font-size="22" text-anchor="end" class="sub">2^256 − 1</text>
<rect x="62" y="134" width="16" height="32" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="60" y="206" font-size="24" text-anchor="start">slot 0, 1, 2 …</text>
<text x="60" y="236" font-size="22" text-anchor="start" class="sub">state variables</text>
<line x1="463.2" y1="134" x2="463.2" y2="166" stroke="#666666" stroke-width="2"/>
<line x1="589.2" y1="134" x2="589.2" y2="166" stroke="#666666" stroke-width="2"/>
<line x1="706.8000000000001" y1="134" x2="706.8000000000001" y2="166" stroke="#666666" stroke-width="2"/>
<line x1="816.0" y1="134" x2="816.0" y2="166" stroke="#666666" stroke-width="2"/>
<text x="564.0" y="86" font-size="24" text-anchor="middle">keccak256(key, slot)</text>
<text x="564.0" y="116" font-size="22" text-anchor="middle" class="sub">mapping values: preimage known</text>
<line x1="237.1875" y1="132" x2="237.1875" y2="168" stroke="#d4a24c" stroke-width="4"/>
<line x1="237.1875" y1="168" x2="200" y2="290" stroke="#d4a24c" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="237.1875" y1="168" x2="900" y2="290" stroke="#d4a24c" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="200" y="290" width="700" height="84" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text x="220" y="324" font-size="24" text-anchor="start">0x3608…2bbd</text>
<text x="410" y="324" font-size="22" text-anchor="start">keccak256(&quot;eip1967.proxy.implementation&quot;)</text>
<text x="410" y="356" font-size="22" text-anchor="start" class="sub">preimage known: the string</text>
<rect x="200" y="390" width="700" height="84" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="220" y="424" font-size="24" text-anchor="start">0x3608…2bbc</text>
<text x="410" y="424" font-size="22" text-anchor="start">the hash − 1 = ERC-1967 implementation slot</text>
<text x="410" y="456" font-size="22" text-anchor="start" class="sub">no known preimage</text>
</svg>
