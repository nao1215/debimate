<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>プロキシが storage と実装のアドレスを持ち、DELEGATECALL で実装 V2 のコードを使う</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="62" y="120" font-size="26" font-weight="normal" text-anchor="middle">利用者</text>
<circle cx="62" cy="180" r="22" fill="#f2f2f2" stroke="#1f1f1f" stroke-width="2"/>
<circle cx="62" cy="250" r="22" fill="#f2f2f2" stroke="#1f1f1f" stroke-width="2"/>
<circle cx="62" cy="320" r="22" fill="#f2f2f2" stroke="#1f1f1f" stroke-width="2"/>
<line x1="92" y1="250" x2="128" y2="250" stroke="#1f1f1f" stroke-width="4"/>
<polygon points="144,250 126,239 126,261" fill="#1f1f1f"/>
<rect x="150" y="40" width="420" height="460" rx="14" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="360" y="86" font-size="26" font-weight="normal" text-anchor="middle">プロキシ（アドレスは不変）</text>
<text x="360" y="124" font-size="24" font-weight="normal" text-anchor="middle" class="sub">storage はすべてここ</text>
<rect x="172" y="150" width="376" height="64" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="190" y="191" font-size="24" font-weight="normal" text-anchor="start" class="sub">slot 0</text>
<text x="532" y="191" font-size="24" font-weight="normal" text-anchor="end">owner</text>
<rect x="172" y="232" width="376" height="64" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="190" y="273" font-size="24" font-weight="normal" text-anchor="start" class="sub">slot 1</text>
<text x="532" y="273" font-size="24" font-weight="normal" text-anchor="end">balance</text>
<rect x="172" y="314" width="376" height="64" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="190" y="355" font-size="24" font-weight="normal" text-anchor="start" class="sub">0xae0e…</text>
<text x="532" y="355" font-size="24" font-weight="normal" text-anchor="end">名前空間</text>
<rect x="172" y="396" width="376" height="64" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="190" y="437" font-size="24" font-weight="normal" text-anchor="start" class="sub">0x3608…</text>
<text x="532" y="437" font-size="24" font-weight="normal" text-anchor="end">実装のアドレス</text>
<rect x="700" y="60" width="230" height="150" rx="12" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="8 6"/>
<text x="815" y="120" font-size="28" font-weight="normal" text-anchor="middle" class="sub">実装 V1</text>
<text x="815" y="162" font-size="24" font-weight="normal" text-anchor="middle" class="sub">差し替え前</text>
<rect x="700" y="300" width="230" height="150" rx="12" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="815" y="360" font-size="28" font-weight="normal" text-anchor="middle">実装 V2</text>
<text x="815" y="402" font-size="24" font-weight="normal" text-anchor="middle">今のコード</text>
<path d="M 548 428 C 630 428, 620 140, 698 140" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="548" y1="436" x2="680" y2="380" stroke="#7aa6c2" stroke-width="5"/>
<polygon points="696,380 678,369 678,391" fill="#7aa6c2"/>
<text x="815" y="490" font-size="24" font-weight="normal" text-anchor="middle" class="sub">DELEGATECALL で実行</text>
</svg>
