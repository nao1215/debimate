<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Bundler は 1 件の UserOperation を 3 回検証してから送る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="20" y="150" width="240" height="130" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="140" y="205" font-size="24" text-anchor="middle" style="fill:#1f1f1f">受け取った時</text>
<text x="140" y="250" font-size="24" text-anchor="middle" style="fill:#666666">1 件だけ</text>
<text x="140" y="340" font-size="24" text-anchor="middle" style="fill:#666666">規則を当てる</text>
<rect x="290" y="150" width="240" height="130" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="410" y="205" font-size="24" text-anchor="middle" style="fill:#1f1f1f">バンドルに入れる前</text>
<text x="410" y="250" font-size="24" text-anchor="middle" style="fill:#666666">1 件ずつ</text>
<text x="410" y="340" font-size="24" text-anchor="middle" style="fill:#666666">状態の変化を見る</text>
<rect x="560" y="150" width="240" height="130" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="680" y="205" font-size="24" text-anchor="middle" style="fill:#1f1f1f">送る直前</text>
<text x="680" y="250" font-size="24" text-anchor="middle" style="fill:#666666">バンドル全体</text>
<text x="680" y="340" font-size="24" text-anchor="middle" style="fill:#666666">組み合わせを見る</text>
<line x1="264" y1="215" x2="286" y2="215" stroke="#666666" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="534" y1="215" x2="556" y2="215" stroke="#666666" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="804" y1="215" x2="826" y2="215" stroke="#666666" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="830" y="150" width="115" height="130" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="887" y="205" font-size="24" text-anchor="middle" style="fill:#1f1f1f">チェーン</text>
<text x="887" y="250" font-size="24" text-anchor="middle" style="fill:#666666">で実行</text>
<text x="410" y="80" font-size="26" text-anchor="middle" style="fill:#1f1f1f">オフチェーンの検証（eth_call・debug_traceCall）</text>
<text x="480" y="440" font-size="24" text-anchor="middle" style="fill:#1f1f1f">3 回目で、バンドルの中だけ revert する主体を見つける</text>
<text x="480" y="490" font-size="24" text-anchor="middle" style="fill:#666666">チェーンの上で失敗すると、手数料は Bundler が払う</text>
</svg>
