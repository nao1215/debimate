<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Gate を閉じた攻撃者より、revert したバンドルを送った Bundler が多く払った</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="480" y="70" font-size="26" text-anchor="middle" style="fill:#1f1f1f">無効になったバンドル 1 件で払った額（gwei）</text>
<text x="280" y="180" font-size="24" text-anchor="end" style="fill:#1f1f1f">Bundler</text>
<rect x="300" y="145" width="520.0" height="56" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="836.0" y="182" font-size="24" text-anchor="start" style="fill:#1f1f1f">207,780</text>
<text x="280" y="300" font-size="24" text-anchor="end" style="fill:#1f1f1f">攻撃者</text>
<rect x="300" y="265" width="160.88766965059196" height="56" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="476.887669650592" y="302" font-size="24" text-anchor="start" style="fill:#1f1f1f">64,287</text>
<text x="280" y="420" font-size="24" text-anchor="end" style="fill:#1f1f1f">10 個の GateAccount</text>
<line x1="300" y1="380" x2="300" y2="446" stroke="#666666" stroke-width="2.5"/>
<text x="316.0" y="422" font-size="24" text-anchor="start" style="fill:#1f1f1f">0</text>
<text x="480" y="510" font-size="24" text-anchor="middle" style="fill:#666666">同じブロックで Gate.close() を先に入れた場合（3 段目）</text>
</svg>
