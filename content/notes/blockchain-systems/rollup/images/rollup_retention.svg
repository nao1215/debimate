<text x="410" y="455" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">5</text>
<line x1="570" y1="100" x2="570" y2="420" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="570" y="455" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">10</text>
<line x1="730" y1="100" x2="730" y2="420" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="730" y="455" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">15</text>
<line x1="890" y1="100" x2="890" y2="420" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>
<text x="890" y="455" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">20</text>
