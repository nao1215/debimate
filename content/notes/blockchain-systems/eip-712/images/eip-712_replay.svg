<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>同じ permit の署名を 3 つのトークンに渡すと、ドメインが違う 2 つでは別人のアドレスが復元される</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="30" y="200" width="230" height="140" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="145" y="255" font-size="28" text-anchor="middle">1 signature</text>
<text x="145" y="298" font-size="24" text-anchor="middle" class="sub mono">owner 0x7099…</text>
<line x1="260" y1="270" x2="340" y2="110" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<rect x="345" y="40" width="440" height="140" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="370" y="82" font-size="26" text-anchor="start">token, chain 31337</text>
<text x="370" y="120" font-size="24" text-anchor="start" class="sub">the signed domain</text>
<text x="370" y="158" font-size="24" text-anchor="start" class="mono">recovers 0x7099… = owner</text>
<line x1="260" y1="270" x2="340" y2="270" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<rect x="345" y="200" width="440" height="140" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="370" y="242" font-size="26" text-anchor="start">same address, chain 31338</text>
<text x="370" y="280" font-size="24" text-anchor="start" class="sub">chainId differs</text>
<text x="370" y="318" font-size="24" text-anchor="start" class="mono">recovers 0x099c…</text>
<line x1="260" y1="270" x2="340" y2="430" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<rect x="345" y="360" width="440" height="140" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="370" y="402" font-size="26" text-anchor="start">2nd token, chain 31337</text>
<text x="370" y="440" font-size="24" text-anchor="start" class="sub">verifyingContract differs</text>
<text x="370" y="478" font-size="24" text-anchor="start" class="mono">recovers 0x0eEA…</text>
<text x="860" y="118" font-size="26" text-anchor="middle">permit OK</text>
<path d="M795,250 H812 V450 H795" fill="none" stroke="#666666" stroke-width="2"/>
<rect x="822" y="318" width="120" height="64" rx="6" fill="#fbe3e3" stroke="#e15759" stroke-width="2"/>
<text x="882" y="360" font-size="26" text-anchor="middle">revert</text>
<text x="480" y="525" font-size="24" text-anchor="middle" class="sub">≠ owner: the same signature reads as someone else&#x27;s</text>
</svg>
