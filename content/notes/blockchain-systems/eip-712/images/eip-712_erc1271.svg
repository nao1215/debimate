<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>署名者のアドレスにコードが無ければ ecrecover、あればアカウントの isValidSignature に問い合わせる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="30" y="200" width="250" height="140" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="155" y="255" font-size="26" text-anchor="middle">signer address</text>
<text x="155" y="298" font-size="26" text-anchor="middle">has code?</text>
<line x1="280" y1="240" x2="330" y2="130" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<text x="300" y="160" font-size="24" text-anchor="end" class="sub">no</text>
<rect x="340" y="50" width="590" height="160" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="365" y="92" font-size="26" text-anchor="start">EOA</text>
<text x="365" y="138" font-size="26" text-anchor="start" class="mono">ecrecover(digest, sig)</text>
<text x="365" y="182" font-size="26" text-anchor="start" class="mono">== signer address ?</text>
<line x1="280" y1="300" x2="330" y2="410" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<text x="300" y="395" font-size="24" text-anchor="end" class="sub">yes</text>
<rect x="340" y="330" width="590" height="160" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="365" y="372" font-size="26" text-anchor="start">contract account (ERC-1271)</text>
<text x="365" y="418" font-size="24" text-anchor="start" class="mono">signer.isValidSignature(digest, sig)</text>
<text x="365" y="462" font-size="26" text-anchor="start" class="mono">== 0x1626ba7e ?</text>
<text x="635" y="268" font-size="24" text-anchor="middle" class="sub">ecrecover only: StudyAccount → false</text>
<text x="635" y="306" font-size="24" text-anchor="middle" class="sub">with the branch: StudyAccount → true</text>
</svg>
