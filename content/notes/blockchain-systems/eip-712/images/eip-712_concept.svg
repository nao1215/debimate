<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>署名する 32 バイトは 0x1901、domain separator、メッセージのハッシュを繋いだもののハッシュ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<path d="M40,84 V70 H920 V84" fill="none" stroke="#666666" stroke-width="2"/>
<text x="480" y="52" font-size="26" text-anchor="middle">keccak256( whole row ) = the 32 bytes the key signs</text>
<rect x="40" y="92" width="90" height="76" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="85" y="140" font-size="26" text-anchor="middle" class="mono">1901</text>
<rect x="130" y="92" width="390" height="76" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="325" y="140" font-size="28" text-anchor="middle">domain separator</text>
<rect x="520" y="92" width="400" height="76" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="720" y="140" font-size="28" text-anchor="middle">hashStruct(message)</text>
<rect x="150" y="218" width="350" height="230" rx="8" fill="#ffffff" stroke="#d4a24c" stroke-width="2"/>
<text x="176" y="262" font-size="26" text-anchor="start" class="mono">name</text>
<text x="176" y="312" font-size="26" text-anchor="start" class="mono">version</text>
<text x="176" y="362" font-size="26" text-anchor="start" class="mono">chainId</text>
<text x="176" y="412" font-size="26" text-anchor="start" class="mono">verifyingContract</text>
<line x1="325" y1="168" x2="325" y2="214" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<rect x="410" y="338" width="76" height="40" rx="6" fill="#fbe3e3" stroke="#e15759" stroke-width="2"/>
<text x="448" y="367" font-size="28" text-anchor="middle" style="fill:#e15759">≠</text>
<rect x="530" y="218" width="390" height="230" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="556" y="262" font-size="26" text-anchor="start" class="mono">typeHash</text>
<text x="556" y="298" font-size="24" text-anchor="start" class="sub mono">Permit(address owner,…)</text>
<text x="556" y="362" font-size="24" text-anchor="start" class="mono">owner / spender</text>
<text x="556" y="408" font-size="24" text-anchor="start" class="mono">value / nonce / deadline</text>
<line x1="720" y1="168" x2="720" y2="214" stroke="#666666" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="506" font-size="24" text-anchor="middle" class="sub">another chainId or contract → another digest → signature fails</text>
</svg>
