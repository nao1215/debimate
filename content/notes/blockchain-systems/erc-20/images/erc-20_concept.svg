<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>transfer と approve がトークンコントラクトのどの行を変えるか</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="25" y="30" width="640" height="400" rx="16" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="345" y="72" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">トークンコントラクト</text>
<text x="190" y="125" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#666666">balanceOf</text>
<rect x="55" y="145" width="270" height="70" rx="8" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="117" y="189" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">所有者</text>
<line x1="179" y1="155" x2="179" y2="205" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<text x="252" y="189" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">100 → 95</text>
<rect x="55" y="227" width="270" height="70" rx="8" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="117" y="271" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">受取人</text>
<line x1="179" y1="237" x2="179" y2="287" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<text x="252" y="271" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">0 → 5</text>
<rect x="55" y="309" width="270" height="70" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="117" y="353" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">spender</text>
<line x1="179" y1="319" x2="179" y2="369" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="252" y="353" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">0</text>
<text x="500" y="125" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#666666">allowance</text>
<rect x="365" y="145" width="270" height="70" rx="8" fill="#d4a24c" stroke="#d4a24c" stroke-width="2.5"/>
<text x="427" y="189" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">spender</text>
<line x1="489" y1="155" x2="489" y2="205" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<text x="562" y="189" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">0 → 30</text>
<text x="500" y="270" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">所有者が spender に</text>
<text x="500" y="302" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">認めた額</text>
<rect x="700" y="120" width="235" height="230" rx="14" fill="#f2f2f2" stroke="#666666" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="817" y="100" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">コントラクトの外</text>
<text x="817" y="165" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">アカウントの状態</text>
<rect x="725" y="190" width="185" height="60" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="817" y="230" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">所有者の ETH</text>
<rect x="725" y="264" width="185" height="60" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="817" y="304" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">受取人の ETH</text>
<rect x="60" y="467" width="30" height="30" rx="4" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="2"/>
<text x="104" y="490" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">transfer 5 で変わる</text>
<rect x="400" y="467" width="30" height="30" rx="4" fill="#d4a24c" stroke="#d4a24c" stroke-width="2"/>
<text x="444" y="490" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">approve 30 で変わる</text>
