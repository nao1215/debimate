<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>取引の手数料を gas の量と 1 gas あたりの額の面積で表した図</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="200" y="100" width="560" height="330" rx="0" fill="#f2f2f2" stroke="#666666" stroke-width="2.5" stroke-dasharray="10 7"/>
<rect x="200" y="270" width="360" height="160" rx="0" fill="#d4a24c" stroke="none" stroke-width="2.5"/>
<rect x="200" y="205" width="360" height="65" rx="0" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<text x="380.0" y="359.0" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">base fee の分 → 焼却</text>
<text x="380.0" y="246.5" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">priority fee の分 → 参加者</text>
<text x="380.0" y="161.5" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">単価の上限までの余り</text>
<text x="660.0" y="250" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">使わずに</text>
<text x="660.0" y="284" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">済んだ gas</text>
<line x1="200" y1="430" x2="200" y2="70" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<line x1="200" y1="430" x2="810" y2="430" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<text x="70" y="265" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f" transform="rotate(-90 70 265)">1 gas あたりの額</text>
<text x="820" y="438" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">gas</text>
<line x1="190" y1="100" x2="200" y2="100" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
<text x="184" y="108" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">maxFeePerGas</text>
<line x1="190" y1="270" x2="200" y2="270" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
<text x="184" y="278" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">base fee</text>
<line x1="560" y1="430" x2="560" y2="440" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
<text x="560" y="470" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">使った gas</text>
<line x1="760" y1="430" x2="760" y2="440" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
<text x="760" y="470" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">gasLimit</text>
<text x="480" y="60" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">外枠：最大手数料（gasLimit × maxFeePerGas）</text>
<text x="480" y="515" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">塗った面積が実際に払う手数料</text>
</svg>
