<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>矛盾する 2 つの checkpoint に 2/3 ずつ投票が集まると、1/3 以上のバリデータが両方に投票している</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="480.0" y="56" font-size="26" text-anchor="middle" class="sub">all stake of the validators</text>
<rect x="120" y="76" width="720" height="16" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
<line x1="360.0" y1="104" x2="360.0" y2="330" stroke="#666666" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="600.0" y1="104" x2="600.0" y2="330" stroke="#666666" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="120" y="120" width="480.0" height="70" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="360.0" y="165" font-size="26" text-anchor="middle">2/3 vote: checkpoint A</text>
<rect x="360.0" y="220" width="480.0" height="70" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="600.0" y="265" font-size="26" text-anchor="middle">2/3 vote: conflicting B</text>
<path d="M360.0,345 V360 H600.0 V345" fill="none" stroke="#666666" stroke-width="2"/>
<text x="480.0" y="400" font-size="26" text-anchor="middle">at least 1/3 voted for both</text>
<rect x="410.0" y="420" width="140" height="56" rx="6" fill="#fbe3e3" stroke="#e15759" stroke-width="2"/>
<text x="480.0" y="458" font-size="26" text-anchor="middle">slashed</text>
<text x="120" y="520" font-size="24" text-anchor="middle" class="sub">0</text>
<text x="360.0" y="520" font-size="24" text-anchor="middle" class="sub">1/3</text>
<text x="600.0" y="520" font-size="24" text-anchor="middle" class="sub">2/3</text>
<text x="840" y="520" font-size="24" text-anchor="middle" class="sub">1</text>
</svg>
