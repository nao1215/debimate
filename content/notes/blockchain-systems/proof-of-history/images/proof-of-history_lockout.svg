<circle cx="525.0" cy="240.9" r="6" fill="#ffffff" stroke="#d4a24c" stroke-width="3"/>
<circle cx="900.0" cy="50.0" r="6" fill="#ffffff" stroke="#d4a24c" stroke-width="3"/>
<polyline points="187.5,412.7 225.0,412.7 262.5,404.8 300.0,393.6 337.5,380.7 375.0,366.6 412.5,351.8 450.0,336.4 487.5,320.5 525.0,304.3 562.5,287.9 600.0,271.2 637.5,254.3 675.0,237.2 712.5,220.0 750.0,202.7 787.5,185.3 825.0,167.8 862.5,150.2 900.0,132.5" fill="none" stroke="#7aa6c2" stroke-width="3"/>
