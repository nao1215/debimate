<circle cx="262.5" cy="404.8" r="6" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<circle cx="525.0" cy="304.3" r="6" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<circle cx="900.0" cy="132.5" r="6" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<text x="193.5" y="448.72727272727275" font-size="24" text-anchor="start">2 倍</text>
<text x="274.5" y="440.8038295592221" font-size="24" text-anchor="start">約 2.7 倍</text>
<text x="539.0" y="338.32771817512236" font-size="24" text-anchor="start">約 102 倍</text>
<text x="888.0" y="172.50953635694054" font-size="24" text-anchor="end">約 5 万 2 千倍</text>
<line x1="180" y1="84" x2="230" y2="84" stroke="#d4a24c" stroke-width="3"/>
<text x="242" y="92" font-size="24" text-anchor="start">lockout（スロット）= 2^n</text>
<line x1="180" y1="124" x2="230" y2="124" stroke="#7aa6c2" stroke-width="3"/>
<text x="242" y="132" font-size="24" text-anchor="start">覆すのに要る速さ（倍）= 2^n / n</text>
</svg>
