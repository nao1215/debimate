<text x="138" y="439.8181818181818" font-size="24" text-anchor="end" class="sub">1</text>
<line x1="150" y1="336.3636363636364" x2="900" y2="336.3636363636364" stroke="#e3e3e3" stroke-width="1"/>
<text x="138" y="344.3636363636364" font-size="24" text-anchor="end" class="sub">32</text>
<line x1="150" y1="240.9090909090909" x2="900" y2="240.9090909090909" stroke="#e3e3e3" stroke-width="1"/>
<text x="138" y="248.9090909090909" font-size="24" text-anchor="end" class="sub">1,024</text>
<line x1="150" y1="145.45454545454544" x2="900" y2="145.45454545454544" stroke="#e3e3e3" stroke-width="1"/>
<text x="138" y="153.45454545454544" font-size="24" text-anchor="end" class="sub">3.3 万</text>
<line x1="150" y1="50.0" x2="900" y2="50.0" stroke="#e3e3e3" stroke-width="1"/>
<text x="138" y="58.0" font-size="24" text-anchor="end" class="sub">105 万</text>
<line x1="150" y1="470" x2="900" y2="470" stroke="#666666" stroke-width="2"/>
<line x1="150" y1="470" x2="150" y2="50" stroke="#666666" stroke-width="2"/>
<text x="187.5" y="502" font-size="24" text-anchor="middle" class="sub">1</text>
<text x="337.5" y="502" font-size="24" text-anchor="middle" class="sub">5</text>
<text x="525.0" y="502" font-size="24" text-anchor="middle" class="sub">10</text>
<text x="712.5" y="502" font-size="24" text-anchor="middle" class="sub">15</text>
<text x="900.0" y="502" font-size="24" text-anchor="middle" class="sub">20</text>
<text x="525.0" y="534" font-size="24" text-anchor="middle">積まれた票の数 n</text>
