<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img"><title>実測したローカル送金。チェーンAだけで残高が変化</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#596b76" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;fill:#28343b} .small{fill:#555}</style>
<rect width="720" height="390" fill="white"/>
<text x="20" y="32" font-size="25" font-weight="bold" text-anchor="start">チェーン A：1 ETH を送金</text>
<text x="20" y="63" font-size="18" font-weight="normal" text-anchor="start">開発用の残高。現実の価値はない</text>
<rect x="20" y="82" width="315" height="149" fill="#eaf1f5" stroke="#9cabb5" stroke-width="1.3"/>
<text x="36" y="114" font-size="23" font-weight="bold" text-anchor="start">送金者</text>
<text x="36" y="151" font-size="23" font-weight="normal" text-anchor="start">10,000 ETH</text>
<line x1="55" y1="160" x2="55" y2="184" stroke="#596b76" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="36" y="215" font-size="22" font-weight="normal" text-anchor="start">9,998.999979 ETH</text>
<rect x="385" y="82" width="315" height="149" fill="#eaf1f5" stroke="#9cabb5" stroke-width="1.3"/>
<text x="401" y="114" font-size="23" font-weight="bold" text-anchor="start">受取人</text>
<text x="401" y="151" font-size="23" font-weight="normal" text-anchor="start">10,000 ETH</text>
<line x1="420" y1="160" x2="420" y2="184" stroke="#596b76" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="401" y="215" font-size="22" font-weight="normal" text-anchor="start">10,001 ETH</text>
<line x1="338" y1="149" x2="378" y2="149" stroke="#596b76" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="20" y="262" font-size="22" font-weight="normal" text-anchor="start">送金者の減少 = 1 ETH ＋ 手数料 0.000021 ETH</text>
<line x1="20" y1="285" x2="700" y2="285" stroke="#596b76" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="20" y="320" font-size="24" font-weight="bold" text-anchor="start">チェーン B：送金なし</text>
<text x="20" y="356" font-size="22" font-weight="normal" text-anchor="start">同じアドレスでも、両者とも 10,000 ETH のまま</text>
</svg>
