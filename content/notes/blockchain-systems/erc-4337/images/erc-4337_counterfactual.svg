<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>The account address is fixed before the account exists</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="480" y="56" font-size="28" text-anchor="middle" style="fill:#1f1f1f">account address 0xD34A...EA21</text>
<text x="480" y="94" font-size="24" text-anchor="middle" style="fill:#666666">the same address in all three steps</text>
<rect x="24" y="140" width="280" height="340" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="164" y="196" font-size="28" text-anchor="middle" style="fill:#1f1f1f">1. compute</text>
<text x="164" y="270" font-size="24" text-anchor="middle" style="fill:#666666">CREATE2 formula</text>
<text x="164" y="322" font-size="24" text-anchor="middle" style="fill:#666666">factory.getAddress</text>
<text x="164" y="374" font-size="24" text-anchor="middle" style="fill:#666666">getSenderAddress</text>
<text x="164" y="450" font-size="24" text-anchor="middle" style="fill:#1f1f1f">all three equal</text>
<line x1="308" y1="310" x2="336" y2="310" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<rect x="340" y="140" width="280" height="340" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="480" y="196" font-size="28" text-anchor="middle" style="fill:#1f1f1f">2. receive ETH</text>
<text x="480" y="270" font-size="24" text-anchor="middle" style="fill:#666666">code: 0x (empty)</text>
<text x="480" y="322" font-size="24" text-anchor="middle" style="fill:#666666">balance: 0.1 ETH</text>
<line x1="624" y1="310" x2="652" y2="310" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<rect x="656" y="140" width="280" height="340" rx="10" fill="#e9f1e6" stroke="#8fae86" stroke-width="2.5"/>
<text x="796" y="196" font-size="28" text-anchor="middle" style="fill:#1f1f1f">3. op1 initCode</text>
<text x="796" y="270" font-size="24" text-anchor="middle" style="fill:#666666">code: 141 bytes</text>
<text x="796" y="322" font-size="24" text-anchor="middle" style="fill:#666666">ERC1967Proxy</text>
</svg>
