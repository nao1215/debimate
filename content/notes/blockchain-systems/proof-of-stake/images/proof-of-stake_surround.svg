<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>epoch の区間で比べる包囲投票</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="40" y="52" font-size="26" font-weight="normal" text-anchor="start" style="fill:#666666">source.epoch → target.epoch の区間</text>
<line x1="270" y1="92" x2="270" y2="452" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="510" y1="92" x2="510" y2="452" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="60" y="139" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">A  2→5</text>
<line x1="270" y1="130" x2="504" y2="130" stroke="#7aa6c2" stroke-width="7" stroke-linecap="round"/>
<circle cx="270" cy="130" r="9" fill="#ffffff" stroke="#7aa6c2" stroke-width="4"/>
<circle cx="510" cy="130" r="9" fill="#7aa6c2" stroke="#7aa6c2" stroke-width="4"/>
<text x="650" y="139" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">基準の投票</text>
<text x="60" y="229" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">B  3→4</text>
<line x1="350" y1="220" x2="424" y2="220" stroke="#d4a24c" stroke-width="7" stroke-linecap="round"/>
<circle cx="350" cy="220" r="9" fill="#ffffff" stroke="#d4a24c" stroke-width="4"/>
<circle cx="430" cy="220" r="9" fill="#d4a24c" stroke="#d4a24c" stroke-width="4"/>
<path d="M648,208 L672,232 M672,208 L648,232" fill="none" stroke="#e15759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="686" y="229" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">包囲する</text>
<text x="60" y="319" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">C  2→4</text>
<line x1="270" y1="310" x2="424" y2="310" stroke="#d4a24c" stroke-width="7" stroke-linecap="round"/>
<circle cx="270" cy="310" r="9" fill="#ffffff" stroke="#d4a24c" stroke-width="4"/>
<circle cx="430" cy="310" r="9" fill="#d4a24c" stroke="#d4a24c" stroke-width="4"/>
<text x="650" y="319" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">包囲しない（起点が同じ）</text>
<text x="60" y="409" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">D  3→6</text>
<line x1="350" y1="400" x2="584" y2="400" stroke="#d4a24c" stroke-width="7" stroke-linecap="round"/>
<circle cx="350" cy="400" r="9" fill="#ffffff" stroke="#d4a24c" stroke-width="4"/>
<circle cx="590" cy="400" r="9" fill="#d4a24c" stroke="#d4a24c" stroke-width="4"/>
<text x="650" y="409" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">包囲しない（交差のみ）</text>
<line x1="170" y1="480" x2="610" y2="480" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<line x1="190" y1="474" x2="190" y2="486" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="190" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">1</text>
<line x1="270" y1="474" x2="270" y2="486" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="270" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">2</text>
<line x1="350" y1="474" x2="350" y2="486" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="350" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">3</text>
<line x1="430" y1="474" x2="430" y2="486" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="430" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">4</text>
<line x1="510" y1="474" x2="510" y2="486" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="510" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">5</text>
<line x1="590" y1="474" x2="590" y2="486" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
<text x="590" y="518" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">6</text>
<text x="630" y="518" font-size="24" font-weight="normal" text-anchor="start" style="fill:#666666">epoch</text>
</svg>
