<line x1="194" y1="310" x2="220" y2="232.0" stroke="#d4a24c" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="220" y="200" width="64" height="64" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="374" y1="332.0" x2="400" y2="332.0" stroke="#666666" stroke-width="2.5"/>
<rect x="400" y="300" width="64" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="252" y="186" font-size="24" text-anchor="middle" font-weight="normal" class="sub">dropped</text>
<text x="240" y="430" font-size="24" text-anchor="middle" font-weight="normal">reorg can undo blocks</text>
<text x="720" y="70" font-size="32" text-anchor="middle" font-weight="normal">CometBFT</text>
<text x="720" y="108" font-size="24" text-anchor="middle" font-weight="normal" class="sub">&gt; 2/3 commits, else waits</text>
