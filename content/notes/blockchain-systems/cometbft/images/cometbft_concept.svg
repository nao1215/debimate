<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>PoW は分岐して長い方に揃うが、CometBFT は 2/3 を超える票で確定し、届かなければ分岐せずに次の高さで待つ</title>
