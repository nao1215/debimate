<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>票を出さない重みが 1/3 未満なら確定が進み、1/3 以上なら全体が止まる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="20" y="60" font-size="26" text-anchor="start" font-weight="normal" class="sub">票を出さない重みの割合</text>
<rect x="40" y="110" width="293.3333333333333" height="120" rx="0" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="333.3333333333333" y="110" width="586.6666666666667" height="120" rx="0" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="186.66666666666666" y="182" font-size="28" text-anchor="middle" font-weight="normal">確定が進む</text>
<text x="626.6666666666666" y="182" font-size="28" text-anchor="middle" font-weight="normal">全体が止まり、分岐しない</text>
<line x1="333.3333333333333" y1="96" x2="333.3333333333333" y2="290" stroke="#1f1f1f" stroke-width="3"/>
<text x="333.3333333333333" y="86" font-size="26" text-anchor="middle" font-weight="normal">1/3</text>
<line x1="40" y1="270" x2="920" y2="270" stroke="#666666" stroke-width="2.5"/>
<text x="920" y="305" font-size="24" text-anchor="middle" font-weight="normal" class="sub">1</text>
<circle cx="40" cy="270" r="11" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="20" y="350" font-size="26" text-anchor="start" font-weight="normal">4 台</text>
<text x="20" y="390" font-size="24" text-anchor="start" font-weight="normal" class="sub">15 個 / 20 秒</text>
<circle cx="260.0" cy="270" r="11" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="260.0" y="350" font-size="26" text-anchor="middle" font-weight="normal">node3 停止</text>
<text x="260.0" y="390" font-size="24" text-anchor="middle" font-weight="normal" class="sub">11 個 / 30 秒</text>
<circle cx="480.0" cy="270" r="11" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="480.0" y="350" font-size="26" text-anchor="middle" font-weight="normal">2 台停止</text>
<text x="480.0" y="390" font-size="24" text-anchor="middle" font-weight="normal" class="sub">0 個 / 45 秒</text>
<text x="700.0" y="350" font-size="26" text-anchor="middle" font-weight="normal">2|2 に分断</text>
<text x="700.0" y="390" font-size="24" text-anchor="middle" font-weight="normal" class="sub">0 個 / 45 秒</text>
<line x1="494.0" y1="278" x2="630.0" y2="322" stroke="#666666" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="470" font-size="24" text-anchor="middle" font-weight="normal" class="sub">確定したブロックの数は、実験 1 回目の各区間</text>
</svg>
