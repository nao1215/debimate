<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>OP_CHECKMULTISIG は末尾から照らし合わせ、飛ばした公開鍵には戻らない</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<line x1="480" y1="40" x2="480" y2="500" stroke="#d9d9d9" stroke-width="2" stroke-linecap="round"/>
<text x="240" y="64" font-size="30" text-anchor="middle" style="fill:#1f1f1f">公開鍵と同じ順</text>
<text x="240" y="102" font-size="24" text-anchor="middle" style="fill:#666666">A, B の順に積む</text>
<rect x="50" y="140" width="100" height="64" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="100" y="182" font-size="26" text-anchor="middle" style="fill:#1f1f1f">鍵 A</text>
<rect x="190" y="140" width="100" height="64" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="240" y="182" font-size="26" text-anchor="middle" style="fill:#1f1f1f">鍵 B</text>
<rect x="330" y="140" width="100" height="64" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="380" y="182" font-size="26" text-anchor="middle" style="fill:#1f1f1f">鍵 C</text>
<rect x="110" y="330" width="120" height="64" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="170" y="372" font-size="26" text-anchor="middle" style="fill:#1f1f1f">署名 A</text>
<rect x="250" y="330" width="120" height="64" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="310" y="372" font-size="26" text-anchor="middle" style="fill:#1f1f1f">署名 B</text>
<line x1="310" y1="326" x2="380" y2="208" stroke="#666666" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="310" y1="326" x2="240" y2="210" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="170" y1="326" x2="100" y2="210" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="240" y="474" font-size="24" text-anchor="middle" style="fill:#666666">最後まで一致して通る</text>
<text x="720" y="64" font-size="30" text-anchor="middle" style="fill:#1f1f1f">逆の順</text>
<text x="720" y="102" font-size="24" text-anchor="middle" style="fill:#666666">B, A の順に積む</text>
<rect x="530" y="140" width="100" height="64" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="580" y="182" font-size="26" text-anchor="middle" style="fill:#1f1f1f">鍵 A</text>
<rect x="670" y="140" width="100" height="64" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="720" y="182" font-size="26" text-anchor="middle" style="fill:#1f1f1f">鍵 B</text>
<rect x="810" y="140" width="100" height="64" rx="10" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="860" y="182" font-size="26" text-anchor="middle" style="fill:#1f1f1f">鍵 C</text>
<rect x="590" y="330" width="120" height="64" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="650" y="372" font-size="26" text-anchor="middle" style="fill:#1f1f1f">署名 B</text>
<rect x="730" y="330" width="120" height="64" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="790" y="372" font-size="26" text-anchor="middle" style="fill:#1f1f1f">署名 A</text>
<line x1="790" y1="326" x2="860" y2="208" stroke="#666666" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="790" y1="326" x2="720" y2="208" stroke="#666666" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="790" y1="326" x2="580" y2="210" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="634" y1="408" x2="666" y2="440" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<line x1="666" y1="408" x2="634" y2="440" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<text x="650" y="474" font-size="24" text-anchor="middle" style="fill:#666666">残る鍵が無い</text>
<text x="720" y="520" font-size="24" text-anchor="middle" style="fill:#666666"></text>
<text x="480" y="528" font-size="24" text-anchor="middle" style="fill:#666666">実線は一致、点線は一致せずに飛ばした公開鍵</text>
</svg>
