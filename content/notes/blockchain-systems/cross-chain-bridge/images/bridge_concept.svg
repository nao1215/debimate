<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>source chain の金庫にロックした分だけ、destination chain で引換券を発行する。間で預け入れを確かめる役が要る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="24" y="24" width="300" height="420" rx="16" fill="#eaf1f5" stroke="none" stroke-width="2.5"/>
<text x="174" y="72" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">source chain</text>
<rect x="64" y="130" width="220" height="200" rx="10" fill="#ffffff" stroke="#7aa6c2" stroke-width="3"/>
<text x="174" y="168" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">金庫</text>
<circle cx="104" cy="230" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="139" cy="230" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="174" cy="230" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="209" cy="230" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="244" cy="230" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="104" cy="278" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="139" cy="278" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="174" cy="278" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="209" cy="278" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="244" cy="278" r="15" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<text x="174" y="380" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">100 をロック</text>
<rect x="636" y="24" width="300" height="420" rx="16" fill="#f2f2f2" stroke="none" stroke-width="2.5"/>
<text x="786" y="72" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">destination chain</text>
<rect x="676" y="130" width="220" height="200" rx="10" fill="#ffffff" stroke="#666666" stroke-width="3"/>
<text x="786" y="168" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">wrapped token</text>
<circle cx="716" cy="230" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="751" cy="230" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="786" cy="230" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="821" cy="230" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="856" cy="230" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="716" cy="278" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="751" cy="278" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="786" cy="278" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="821" cy="278" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="856" cy="278" r="15" fill="#ffffff" stroke="#666666" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="786" y="380" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">100 を発行</text>
<rect x="360" y="170" width="240" height="120" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="480" y="220" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">検証役</text>
<text x="480" y="256" font-size="22" font-weight="normal" text-anchor="middle" style="fill:#666666">預け入れは本当か</text>
<line x1="290" y1="230" x2="352" y2="230" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ochre)"/>
<line x1="606" y1="230" x2="668" y2="230" stroke="#d4a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ochre)"/>
<text x="480" y="500" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">発行した量が金庫の中身を超えると、引換券に裏付けが無くなる</text>
</svg>
