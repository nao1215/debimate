<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>destination chain が確かめる材料と、利用者が信頼する相手の 4 つのタイプ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
<text x="330" y="44" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">確かめるもの</text>
<text x="660" y="44" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">信頼する相手</text>
<rect x="24" y="70" width="912" height="116" rx="12" fill="#eaf1f5" stroke="none" stroke-width="2.5"/>
<text x="44" y="136" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">外部の署名者</text>
<circle cx="340" cy="128" r="11" fill="#d4a24c" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="370" cy="128" r="11" fill="#d4a24c" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="400" cy="128" r="11" fill="#d4a24c" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="430" cy="128" r="11" fill="#d4a24c" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="460" cy="128" r="11" fill="#d4a24c" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="490" cy="128" r="11" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="520" cy="128" r="11" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="550" cy="128" r="11" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<circle cx="580" cy="128" r="11" fill="#ffffff" stroke="#d4a24c" stroke-width="2.5"/>
<text x="660" y="122" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">署名者の過半</text>
<text x="660" y="156" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">（例: 9 人中 5 人）</text>
<rect x="24" y="200" width="912" height="116" rx="12" fill="#eaf1f5" stroke="none" stroke-width="2.5"/>
<text x="44" y="266" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">軽量クライアント</text>
<rect x="330" y="222" width="44" height="30" rx="4" fill="#ffffff" stroke="#7aa6c2" stroke-width="2.5"/>
<rect x="394" y="222" width="44" height="30" rx="4" fill="#ffffff" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="376" y1="237" x2="392" y2="237" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round"/>
<rect x="458" y="222" width="44" height="30" rx="4" fill="#ffffff" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="440" y1="237" x2="456" y2="237" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round"/>
<rect x="522" y="222" width="44" height="30" rx="4" fill="#ffffff" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="504" y1="237" x2="520" y2="237" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round"/>
<line x1="500" y1="254" x2="500" y2="274" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round"/>
<line x1="500" y1="274" x2="472" y2="292" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round"/>
<circle cx="468" cy="296" r="7" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<text x="330" y="302" font-size="20" font-weight="normal" text-anchor="start" style="fill:#666666">ヘッダと経路</text>
<text x="660" y="252" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">source chain の合意</text>
<text x="660" y="286" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">と検証コードの実装</text>
<rect x="24" y="330" width="912" height="116" rx="12" fill="#eaf1f5" stroke="none" stroke-width="2.5"/>
<text x="44" y="396" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">異議の受付期間</text>
<line x1="330" y1="388" x2="590" y2="388" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round"/>
<rect x="370" y="370" width="170" height="36" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="455" y="396" font-size="20" font-weight="normal" text-anchor="middle" style="fill:#666666">待つ</text>
<circle cx="330" cy="388" r="7" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<circle cx="590" cy="388" r="7" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<text x="660" y="382" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">期間内に異議を出す</text>
<text x="660" y="416" font-size="22" font-weight="normal" text-anchor="start" style="fill:#666666">監視者が 1 人以上いる</text>
<rect x="24" y="460" width="912" height="116" rx="12" fill="#eaf1f5" stroke="none" stroke-width="2.5"/>
<text x="44" y="526" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">有効性の証明</text>
<rect x="330" y="490" width="120" height="56" rx="6" fill="#ffffff" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="390" y="526" font-size="22" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">proof</text>
<line x1="456" y1="518" x2="510" y2="518" stroke="#7aa6c2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
<text x="520" y="526" font-size="22" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">検証</text>
<text x="660" y="526" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">証明系と回路の実装</text>
</svg>
