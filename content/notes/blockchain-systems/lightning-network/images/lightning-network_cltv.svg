<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>下流の HTLC ほど期限が早く、その差が中継者の請求の時間になる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker><marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a24c"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="384" y="90" width="442" height="300" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="605.0" y="350" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">34 blocks</text>
<text x="605.0" y="382" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">for Bob to claim</text>
<text x="30" y="132" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Alice → Bob</text>
<rect x="150" y="150" width="676" height="40" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="826" y1="142" x2="826" y2="198" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="30" y="242" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Bob → Carol</text>
<rect x="150" y="260" width="234" height="40" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<line x1="384" y1="252" x2="384" y2="308" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<line x1="150" y1="450" x2="886" y2="450" stroke="#666666" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-sub)"/>
<line x1="150" y1="442" x2="150" y2="458" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<text x="150" y="492" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">N</text>
<line x1="384" y1="442" x2="384" y2="458" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<text x="384" y="492" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">N+18</text>
<line x1="826" y1="442" x2="826" y2="458" stroke="#666666" stroke-width="2.5" stroke-linecap="round"/>
<text x="826" y="492" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">N+52</text>
<text x="886" y="432" font-size="24" font-weight="normal" text-anchor="end" style="fill:#666666">block height</text>
</svg>
