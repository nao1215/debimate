<rect x="280" y="402.0" width="640" height="44" rx="6" fill="none" stroke="#666666" stroke-width="2"/>
<line x1="574.4000000000001" y1="394.0" x2="574.4000000000001" y2="454.0" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="904" y="433" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">Bob</text>
<text x="296" y="433" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Alice</text>
<text x="52" y="509" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">閉鎖</text>
