<text x="600.0" y="60" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">チャネル（容量は一定）</text>
<line x1="196" y1="84" x2="196" y2="508" stroke="#666666" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 9"/>
<text x="52" y="129" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">開設</text>
<circle cx="196" cy="120" r="17" fill="#8fae86" stroke="none" stroke-width="2.5"/>
<line x1="216" y1="120" x2="274" y2="120" stroke="#8fae86" stroke-width="4" stroke-linecap="round"/>
<rect x="280" y="98.0" width="640" height="44" rx="6" fill="#f8eed8" stroke="none" stroke-width="2.5"/>
<rect x="280" y="98.0" width="640.0" height="44" rx="6" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<rect x="280" y="98.0" width="640" height="44" rx="6" fill="none" stroke="#8fae86" stroke-width="3"/>
<text x="296" y="129" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Alice</text>
<text x="52" y="205" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">更新 1</text>
<rect x="280" y="174.0" width="640" height="44" rx="6" fill="#f8eed8" stroke="none" stroke-width="2.5"/>
<rect x="280" y="174.0" width="550.4" height="44" rx="6" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<rect x="280" y="174.0" width="640" height="44" rx="6" fill="none" stroke="#666666" stroke-width="2"/>
<line x1="830.4" y1="166.0" x2="830.4" y2="226.0" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="904" y="205" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">Bob</text>
<text x="296" y="205" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Alice</text>
<text x="52" y="281" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">更新 2</text>
<rect x="280" y="250.0" width="640" height="44" rx="6" fill="#f8eed8" stroke="none" stroke-width="2.5"/>
<rect x="280" y="250.0" width="473.6" height="44" rx="6" fill="#7aa6c2" stroke="none" stroke-width="2.5"/>
<rect x="280" y="250.0" width="640" height="44" rx="6" fill="none" stroke="#666666" stroke-width="2"/>
<line x1="753.6" y1="242.0" x2="753.6" y2="302.0" stroke="#1f1f1f" stroke-width="4" stroke-linecap="round"/>
<text x="904" y="281" font-size="24" font-weight="normal" text-anchor="end" style="fill:#1f1f1f">Bob</text>
<text x="296" y="281" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">Alice</text>
<text x="52" y="357" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">…</text>
<text x="52" y="433" font-size="26" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">更新 n</text>
