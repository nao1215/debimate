<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>フレームの終わり方 4 通り。STOP・RETURN と REVERT は残りのガスを親に返し、例外は渡したガスを全て失い、子を始められない時はガスが親に残る。状態の変更を残すのは STOP・RETURN だけ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="30" y="52" font-size="24" text-anchor="start" class="sub">frame ends with</text>
<text x="440" y="52" font-size="24" text-anchor="middle" class="sub">gas given to the child</text>
<text x="700" y="52" font-size="24" text-anchor="middle" class="sub">state</text>
<text x="880" y="52" font-size="24" text-anchor="middle" class="sub">returns</text>
<text x="30" y="122" font-size="26" text-anchor="start" class="mono">STOP / RETURN</text>
<rect x="290" y="88" width="180" height="52" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="380" y="122" font-size="24" text-anchor="middle">used</text>
<rect x="470" y="88" width="120" height="52" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="530" y="122" font-size="24" text-anchor="middle">back</text>
<text x="700" y="122" font-size="26" text-anchor="middle">kept</text>
<text x="880" y="122" font-size="26" text-anchor="middle" class="mono">1 + data</text>
<text x="30" y="226" font-size="26" text-anchor="start" class="mono">REVERT</text>
<rect x="290" y="192" width="180" height="52" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="380" y="226" font-size="24" text-anchor="middle">used</text>
<rect x="470" y="192" width="120" height="52" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="530" y="226" font-size="24" text-anchor="middle">back</text>
<text x="700" y="226" font-size="26" text-anchor="middle">undone</text>
<text x="880" y="226" font-size="26" text-anchor="middle" class="mono">0 + data</text>
<text x="30" y="330" font-size="26" text-anchor="start">exception</text>
<rect x="290" y="296" width="300" height="52" rx="4" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="440" y="330" font-size="24" text-anchor="middle">all consumed</text>
<text x="700" y="330" font-size="26" text-anchor="middle">undone</text>
<text x="880" y="330" font-size="26" text-anchor="middle" class="mono">0</text>
<text x="30" y="434" font-size="26" text-anchor="start">cannot start</text>
<rect x="290" y="400" width="300" height="52" rx="4" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/>
<text x="440" y="434" font-size="24" text-anchor="middle" class="sub">kept by the parent</text>
<text x="700" y="434" font-size="26" text-anchor="middle">not run</text>
<text x="880" y="434" font-size="26" text-anchor="middle" class="mono">0</text>
<text x="30" y="530" font-size="24" text-anchor="start" class="sub">&quot;kept&quot; changes are still undone if the parent fails later</text>
</svg>
