<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>set(42) の calldata は先頭 4 バイトの selector 60fe47b1 と 32 バイトの引数。CALLDATALOAD と SHR で selector を取り出し、EQ と JUMPI で関数ごとの位置に分岐する。一致しなければ REVERT</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="30" y="44" font-size="24" text-anchor="start" class="sub">calldata (36 bytes)</text>
<rect x="30" y="60" width="220" height="70" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="140" y="106" font-size="28" text-anchor="middle" class="mono">60fe47b1</text>
<rect x="250" y="60" width="680" height="70" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="590" y="106" font-size="28" text-anchor="middle" class="mono">00 … 00 2a  (42)</text>
<text x="140" y="160" font-size="24" text-anchor="middle" class="sub">4 bytes</text>
<text x="590" y="160" font-size="24" text-anchor="middle" class="sub">32 bytes</text>
<rect x="30" y="200" width="250" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="155" y="241" font-size="24" text-anchor="middle" class="mono">CALLDATALOAD 0</text>
<line x1="284" y1="232" x2="316" y2="232" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="320" y="200" width="250" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="445" y="241" font-size="24" text-anchor="middle" class="mono">SHR 224</text>
<line x1="574" y1="232" x2="606" y2="232" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="610" y="200" width="250" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="735" y="241" font-size="26" text-anchor="middle" class="mono">60fe47b1</text>
<rect x="30" y="330" width="250" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="155" y="371" font-size="24" text-anchor="middle" class="mono">EQ 3fa4f245</text>
<text x="155" y="426" font-size="24" text-anchor="middle" class="sub">value()</text>
<line x1="284" y1="362" x2="316" y2="362" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="300" y="350" font-size="22" text-anchor="middle" class="sub">no</text>
<rect x="320" y="330" width="250" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="445" y="371" font-size="24" text-anchor="middle" class="mono">EQ 60fe47b1</text>
<text x="445" y="426" font-size="24" text-anchor="middle" class="sub">set(uint256)</text>
<line x1="574" y1="362" x2="606" y2="362" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="590" y="350" font-size="22" text-anchor="middle" class="sub">yes</text>
<rect x="610" y="330" width="320" height="64" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="770" y="371" font-size="24" text-anchor="middle" class="mono">JUMPI → pc 86</text>
<line x1="155" y1="268" x2="155" y2="326" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="30" y="470" font-size="24" text-anchor="start">neither → REVERT</text>
<line x1="770" y1="398" x2="770" y2="446" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="610" y="450" width="320" height="90" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="770" y="486" font-size="24" text-anchor="middle" class="mono">SSTORE, LOG2, STOP</text>
<text x="770" y="524" font-size="24" text-anchor="middle" class="sub">body of set()</text>
<text x="30" y="514" font-size="24" text-anchor="start" class="sub">The EVM never sees</text>
<text x="30" y="548" font-size="24" text-anchor="start" class="sub">the name &quot;set&quot;.</text>
</svg>
