<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>EIP-1 の種類と分類。Standards Track の中に Core・Networking・Interface・ERC があり、他に Meta と Informational がある。原則としてハードフォークが要るのは Core だけ</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<rect x="380" y="20" width="200" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2.5"/>
<text x="480" y="62" font-size="28" text-anchor="middle">EIP</text>
<line x1="480" y1="84" x2="480" y2="112" stroke="#666666" stroke-width="2.5"/>
<line x1="360" y1="112" x2="945" y2="112" stroke="#666666" stroke-width="2.5"/>
<line x1="360" y1="112" x2="360" y2="136" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="830" y1="112" x2="830" y2="136" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="945" y1="112" x2="945" y2="415" stroke="#666666" stroke-width="2.5"/>
<line x1="945" y1="415" x2="934" y2="415" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="140" width="680" height="400" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="40" y="178" font-size="26" text-anchor="start">Standards Track</text>
<rect x="36" y="200" width="316" height="150" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="56" y="242" font-size="26" text-anchor="start">Core</text>
<text x="56" y="284" font-size="24" text-anchor="start" class="sub">opcodes, gas, tx types</text>
<text x="56" y="322" font-size="24" text-anchor="start">hard fork (as a rule)</text>
<rect x="368" y="200" width="316" height="150" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="388" y="242" font-size="26" text-anchor="start">Networking</text>
<text x="388" y="284" font-size="24" text-anchor="start" class="sub">devp2p</text>
<text x="388" y="322" font-size="24" text-anchor="start" class="sub">no hard fork</text>
<rect x="36" y="370" width="316" height="150" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="56" y="412" font-size="26" text-anchor="start">Interface</text>
<text x="56" y="454" font-size="24" text-anchor="start" class="sub">ABI, method names</text>
<text x="56" y="492" font-size="24" text-anchor="start" class="sub">no hard fork</text>
<rect x="368" y="370" width="316" height="150" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="388" y="412" font-size="26" text-anchor="start">ERC</text>
<text x="388" y="454" font-size="24" text-anchor="start" class="sub">tokens, wallets, signing</text>
<text x="388" y="492" font-size="24" text-anchor="start" class="sub">no hard fork</text>
<rect x="720" y="140" width="210" height="180" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="740" y="182" font-size="26" text-anchor="start">Meta</text>
<text x="740" y="224" font-size="24" text-anchor="start" class="sub">process,</text>
<text x="740" y="258" font-size="24" text-anchor="start" class="sub">fork lists</text>
<text x="740" y="292" font-size="24" text-anchor="start" class="sub">no hard fork</text>
<rect x="720" y="340" width="210" height="150" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="740" y="382" font-size="26" text-anchor="start">Informational</text>
<text x="740" y="424" font-size="24" text-anchor="start" class="sub">guidelines</text>
<text x="740" y="458" font-size="24" text-anchor="start" class="sub">no hard fork</text>
</svg>
