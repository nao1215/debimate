<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>取引の処理の中にメッセージ呼び出しがあり、その中で命令を 1 つずつ実行するループが回る。CALL は同じループを持つ子のフレームを作る。前後に取引の検査と精算がある</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="920" height="430" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="44" y="62" font-size="26" text-anchor="start">transaction (state transition)</text>
<rect x="44" y="100" width="170" height="310" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="129" y="160" font-size="24" text-anchor="middle">signature</text>
<text x="129" y="224" font-size="24" text-anchor="middle">nonce</text>
<text x="129" y="288" font-size="24" text-anchor="middle">intrinsic gas</text>
<text x="129" y="352" font-size="24" text-anchor="middle">buy gas</text>
<rect x="746" y="100" width="170" height="310" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="831" y="180" font-size="24" text-anchor="middle">refund</text>
<text x="831" y="252" font-size="24" text-anchor="middle">pay fee</text>
<text x="831" y="324" font-size="24" text-anchor="middle">receipt</text>
<line x1="214" y1="255" x2="252" y2="255" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="708" y1="255" x2="742" y2="255" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="256" y="100" width="450" height="310" rx="12" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="276" y="140" font-size="24" text-anchor="start">message call (frame)</text>
<rect x="280" y="168" width="400" height="120" rx="10" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="335" y="222" font-size="24" text-anchor="middle">read op</text>
<text x="480" y="222" font-size="24" text-anchor="middle">charge gas</text>
<text x="625" y="222" font-size="24" text-anchor="middle">execute</text>
<line x1="382" y1="214" x2="408" y2="214" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="553" y1="214" x2="580" y2="214" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M 625 236 C 625 276, 335 276, 335 240" fill="none" stroke="#666666" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="318" font-size="24" text-anchor="middle" class="sub">until STOP / RETURN / REVERT / error</text>
<rect x="330" y="340" width="300" height="54" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2" stroke-dasharray="7 5"/>
<text x="480" y="376" font-size="24" text-anchor="middle">CALL → child frame</text>
</svg>
