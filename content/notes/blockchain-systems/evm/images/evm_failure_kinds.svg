<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>取引の失敗は 2 種類ある。署名・nonce・前払いの検査で弾かれた取引はブロックに入らない。コードの実行中に失敗した取引はブロックに入り、status 0 になり、nonce が進み、手数料を払う</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="400" fill="#ffffff"/>
<text x="40" y="112" font-size="26" text-anchor="start">tx</text>
<line x1="76" y1="104" x2="136" y2="104" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="140" y="60" width="250" height="90" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="265" y="98" font-size="26" text-anchor="middle">checks</text>
<text x="265" y="132" font-size="24" text-anchor="middle" class="sub">sig, nonce, prepay</text>
<line x1="390" y1="104" x2="436" y2="104" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="440" y="60" width="250" height="90" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="565" y="98" font-size="26" text-anchor="middle">code runs</text>
<text x="565" y="132" font-size="24" text-anchor="middle" class="sub">EVM frames</text>
<line x1="690" y1="104" x2="756" y2="104" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="760" y="40" width="180" height="340" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="850" y="80" font-size="26" text-anchor="middle">block</text>
<text x="850" y="124" font-size="24" text-anchor="middle">status 1</text>
<line x1="265" y1="150" x2="265" y2="212" stroke="#666666" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<path d="M165 235 L187 257 M187 235 L165 257" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<text x="280" y="254" font-size="26" text-anchor="middle">rejected</text>
<text x="265" y="296" font-size="24" text-anchor="middle" class="sub">not in a block</text>
<text x="265" y="332" font-size="24" text-anchor="middle" class="sub">nonce, fee unchanged</text>
<line x1="565" y1="150" x2="565" y2="216" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="440" y="220" width="250" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="565" y="258" font-size="26" text-anchor="middle">error / REVERT</text>
<text x="565" y="292" font-size="24" text-anchor="middle" class="sub">state undone</text>
<line x1="690" y1="265" x2="756" y2="265" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="850" y="262" font-size="24" text-anchor="middle">status 0</text>
<text x="850" y="302" font-size="24" text-anchor="middle" class="sub">nonce + 1</text>
<text x="850" y="338" font-size="24" text-anchor="middle" class="sub">fee paid</text>
</svg>
