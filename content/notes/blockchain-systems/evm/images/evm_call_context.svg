<text x="168" y="510" font-size="24" text-anchor="middle">msg.sender = Caller</text>
<text x="168" y="548" font-size="24" text-anchor="middle" class="sub">msg.value = 3 wei</text>
<rect x="332" y="20" width="296" height="560" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="1.5"/>
<text x="480" y="62" font-size="26" text-anchor="middle" font-weight="normal">DELEGATECALL</text>
<rect x="356" y="100" width="248" height="160" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="376" y="136" font-size="24" text-anchor="start">Caller</text>
<rect x="372" y="152" width="100" height="92" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="422" y="206" font-size="24" text-anchor="middle">code</text>
