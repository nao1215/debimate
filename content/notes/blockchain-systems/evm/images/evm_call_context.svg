<text x="422" y="406" font-size="24" text-anchor="middle">code</text>
<rect x="488" y="352" width="100" height="92" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="538" y="406" font-size="24" text-anchor="middle">slot 0</text>
<line x1="480" y1="260" x2="480" y2="296" stroke="#666666" stroke-width="3" marker-end="url(#a)"/>
