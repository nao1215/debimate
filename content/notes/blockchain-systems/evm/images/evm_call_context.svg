<text x="226" y="206" font-size="24" text-anchor="middle">slot 0</text>
<rect x="44" y="300" width="248" height="160" rx="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="64" y="336" font-size="24" text-anchor="start">Target</text>
<rect x="60" y="352" width="100" height="92" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="110" y="406" font-size="24" text-anchor="middle">code</text>
<rect x="176" y="352" width="100" height="92" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
