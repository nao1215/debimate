<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>コード 60 5b 5b 00 の各バイト。PC 1 の 5b は PUSH1 の即値で、飛び先にできない。PC 2 の 5b は JUMPDEST で飛べる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="400" fill="#ffffff"/>
<text x="200" y="60" font-size="24" text-anchor="middle" class="sub">PC 0</text>
<rect x="120" y="80" width="160" height="90" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="200" y="140" font-size="34" text-anchor="middle" class="mono">60</text>
<text x="200" y="214" font-size="24" text-anchor="middle">PUSH1</text>
<text x="390" y="60" font-size="24" text-anchor="middle" class="sub">PC 1</text>
<rect x="310" y="80" width="160" height="90" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<text x="390" y="140" font-size="34" text-anchor="middle" class="mono">5b</text>
<text x="390" y="214" font-size="24" text-anchor="middle">data</text>
<text x="580" y="60" font-size="24" text-anchor="middle" class="sub">PC 2</text>
<rect x="500" y="80" width="160" height="90" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="580" y="140" font-size="34" text-anchor="middle" class="mono">5b</text>
<text x="580" y="214" font-size="24" text-anchor="middle">JUMPDEST</text>
<text x="770" y="60" font-size="24" text-anchor="middle" class="sub">PC 3</text>
<rect x="690" y="80" width="160" height="90" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="770" y="140" font-size="34" text-anchor="middle" class="mono">00</text>
<text x="770" y="214" font-size="24" text-anchor="middle">STOP</text>
<path d="M 130 240 L 130 254 L 470 254 L 470 240" fill="none" stroke="#666666" stroke-width="2"/>
<text x="300" y="288" font-size="24" text-anchor="middle" class="sub">one instruction: PUSH1 0x5b</text>
<text x="310" y="352" font-size="26" text-anchor="middle">JUMP to 1</text>
<path d="M408 332 L432 356 M432 332 L408 356" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<text x="650" y="352" font-size="26" text-anchor="middle">JUMP to 2</text>
<path d="M 748 344 l 10 10 l 20 -22" fill="none" stroke="#8fae86" stroke-width="5" stroke-linecap="round"/>
</svg>
