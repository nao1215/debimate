<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><title>CALL のコストを引いた残り 9,943,767 のうち、子が受け取ったのは 63/64 の 9,788,396 で、親に 155,371 が残った。10,000 だけを要求した時は 10,000 が渡った</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="360" fill="#ffffff"/>
<text x="40" y="50" font-size="24" text-anchor="start" class="sub">g = 9,946,370 (before CALL) − 2,603 (CALL costs) = 9,943,767</text>
<rect x="40" y="80" width="866.2500318038426" height="76" rx="4" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2.5"/>
<text x="473.1250159019213" y="128" font-size="26" text-anchor="middle">child gets 9,788,396 (63/64)</text>
<rect x="906.2500318038426" y="80" width="13.749968196157397" height="76" rx="2" fill="#f8eed8" stroke="#d4a24c" stroke-width="2.5"/>
<line x1="913.1250159019213" y1="160" x2="913.1250159019213" y2="186" stroke="#666666" stroke-width="2"/>
<text x="920" y="214" font-size="24" text-anchor="end">parent keeps 155,371 (1/64)</text>
<text x="40" y="290" font-size="26" text-anchor="start">request 10,000 → child gets 10,000</text>
<text x="40" y="326" font-size="24" text-anchor="start" class="sub">(below the limit 9,788,364)</text>
</svg>
