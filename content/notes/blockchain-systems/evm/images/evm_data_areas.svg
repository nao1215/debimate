<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><title>EVM のデータ領域。stack・memory・calldata・returndata はフレームに属し、transient storage・storage・code はアカウントに属する。それぞれの寿命</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<rect x="20" y="20" width="440" height="460" rx="12" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="44" y="62" font-size="26" text-anchor="start">belongs to the frame</text>
<rect x="40" y="84" width="400" height="84" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="60" y="120" font-size="26" text-anchor="start" class="mono">stack</text>
<text x="60" y="154" font-size="24" text-anchor="start" class="sub">to frame end, 256-bit words</text>
<rect x="40" y="180" width="400" height="84" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="60" y="216" font-size="26" text-anchor="start" class="mono">memory</text>
<text x="60" y="250" font-size="24" text-anchor="start" class="sub">to frame end, bytes</text>
<rect x="40" y="276" width="400" height="84" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="60" y="312" font-size="26" text-anchor="start" class="mono">calldata</text>
<text x="60" y="346" font-size="24" text-anchor="start" class="sub">to frame end, read only</text>
<rect x="40" y="372" width="400" height="84" rx="8" fill="#ffffff" stroke="#7aa6c2" stroke-width="2"/>
<text x="60" y="408" font-size="26" text-anchor="start" class="mono">returndata</text>
<text x="60" y="442" font-size="24" text-anchor="start" class="sub">until the next child call</text>
<rect x="500" y="20" width="440" height="460" rx="12" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="524" y="62" font-size="26" text-anchor="start">belongs to the account</text>
<rect x="520" y="84" width="400" height="84" rx="8" fill="#ffffff" stroke="#d4a24c" stroke-width="2"/>
<text x="540" y="120" font-size="26" text-anchor="start" class="mono">transient storage</text>
<text x="540" y="154" font-size="24" text-anchor="start" class="sub">until the tx ends</text>
<rect x="520" y="180" width="400" height="84" rx="8" fill="#ffffff" stroke="#d4a24c" stroke-width="2"/>
<text x="540" y="216" font-size="26" text-anchor="start" class="mono">storage</text>
<text x="540" y="250" font-size="24" text-anchor="start" class="sub">until overwritten</text>
<rect x="520" y="276" width="400" height="84" rx="8" fill="#ffffff" stroke="#d4a24c" stroke-width="2"/>
<text x="540" y="312" font-size="26" text-anchor="start" class="mono">code</text>
<text x="540" y="346" font-size="24" text-anchor="start" class="sub">fixed after deploy, read only</text>
</svg>
