<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img"><title>Osaka の主な命令のガスを対数の目盛りで並べた図。ADD は 3、MUL は 5、JUMPI は 10 の計算の命令に対して、storage やアカウントに触る命令は 100 から 32,000 で、ADD の約 30 倍から 1 万倍</title>
