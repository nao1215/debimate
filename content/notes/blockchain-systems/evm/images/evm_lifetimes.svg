<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><title>1 件の取引の時間軸。stack と memory はフレームの間だけ、transient storage は取引の終わりまで、storage は次の取引にも残る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="24" text-anchor="start" class="sub">time →</text>
<line x1="300" y1="70" x2="930" y2="70" stroke="#666666" stroke-width="2" marker-end="url(#a)"/>
<line x1="300" y1="60" x2="300" y2="480" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="860" y1="60" x2="860" y2="480" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="300" y="46" font-size="24" text-anchor="middle" class="sub">tx start</text>
<text x="860" y="46" font-size="24" text-anchor="middle" class="sub">tx end</text>
<text x="30" y="133" font-size="24" text-anchor="start">frame A</text>
<rect x="300" y="106" width="560" height="38" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="30" y="197" font-size="24" text-anchor="start">frame B (CALL)</text>
<rect x="470" y="170" width="210" height="38" rx="6" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="30" y="261" font-size="24" text-anchor="start">stack, memory of A</text>
<rect x="300" y="234" width="560" height="38" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="30" y="325" font-size="24" text-anchor="start">stack, memory of B</text>
<rect x="470" y="298" width="210" height="38" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="30" y="389" font-size="24" text-anchor="start">transient storage</text>
<rect x="380" y="362" width="480" height="38" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="30" y="453" font-size="24" text-anchor="start">storage</text>
<rect x="240" y="426" width="700" height="38" rx="6" fill="#e9f1e6" stroke="#8fae86" stroke-width="2"/>
<text x="392" y="397" font-size="24" text-anchor="start" class="sub">TSTORE</text>
<path d="M849 378 L871 400 M871 378 L849 400" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<text x="924" y="461" font-size="24" text-anchor="end" class="sub">next tx</text>
</svg>
