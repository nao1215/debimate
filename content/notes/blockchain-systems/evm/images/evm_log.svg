<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>LOG2 が書く内容。topic0 はイベントの署名のハッシュ、topic1 は indexed の sender、data は値。bloom にはアドレスと topic だけが入る。この LOG2 は 1381 ガス</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="30" y="50" font-size="26" text-anchor="start" font-weight="normal">LOG2 in set(42): 1381 gas</text>
<text x="30" y="90" font-size="24" text-anchor="start" class="sub">= 375 + 2 × 375 + 8 × 32 bytes</text>
<rect x="30" y="120" width="560" height="64" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="50" y="162" font-size="24" text-anchor="start" font-weight="normal">address</text>
<text x="190" y="162" font-size="24" text-anchor="start">Dispatcher</text>
<rect x="30" y="198" width="560" height="64" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="50" y="240" font-size="24" text-anchor="start" font-weight="normal">topic0</text>
<text x="190" y="240" font-size="24" text-anchor="start">keccak(&quot;Changed(...)&quot;)</text>
<rect x="30" y="276" width="560" height="64" rx="6" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="50" y="318" font-size="24" text-anchor="start" font-weight="normal">topic1</text>
<text x="190" y="318" font-size="24" text-anchor="start">sender (indexed)</text>
<rect x="30" y="354" width="560" height="64" rx="6" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="50" y="396" font-size="24" text-anchor="start" font-weight="normal">data</text>
<text x="190" y="396" font-size="24" text-anchor="start">value = 42</text>
<rect x="700" y="140" width="230" height="200" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="815" y="220" font-size="26" text-anchor="middle">bloom</text>
<text x="815" y="258" font-size="24" text-anchor="middle" class="sub">2048 bits</text>
<line x1="594" y1="152" x2="696" y2="200" stroke="#666666" stroke-width="2" marker-end="url(#a)"/>
<line x1="594" y1="230" x2="696" y2="230" stroke="#666666" stroke-width="2" marker-end="url(#a)"/>
<line x1="594" y1="308" x2="696" y2="260" stroke="#666666" stroke-width="2" marker-end="url(#a)"/>
<text x="815" y="400" font-size="24" text-anchor="middle" class="sub">data is not in the bloom</text>
</svg>
