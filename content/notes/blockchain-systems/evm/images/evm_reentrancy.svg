<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><title>再入の時間軸。A が B を CALL すると A のフレームは途中で止まり、その間に B が A を呼び返す。2 回目の A は、1 回目の A がまだ更新していない storage を読む</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666} .mono{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa6c2"/></marker></defs>
<rect width="960" height="430" fill="#ffffff"/>
<text x="200" y="44" font-size="24" text-anchor="start" class="sub">time →</text>
<text x="30" y="120" font-size="26" text-anchor="start">A (1st)</text>
<text x="30" y="230" font-size="26" text-anchor="start">B</text>
<text x="30" y="340" font-size="26" text-anchor="start">A (2nd)</text>
<rect x="180" y="80" width="250" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="305" y="120" font-size="24" text-anchor="middle">reads value 10</text>
<rect x="430" y="80" width="330" height="60" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="595" y="120" font-size="24" text-anchor="middle">paused in CALL</text>
<rect x="760" y="80" width="180" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="850" y="120" font-size="24" text-anchor="middle">writes 0</text>
<rect x="450" y="190" width="290" height="60" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="595" y="230" font-size="24" text-anchor="middle">calls A back</text>
<rect x="490" y="300" width="220" height="60" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="600" y="340" font-size="24" text-anchor="middle">reads 10 again</text>
<path d="M729 319 L751 341 M751 319 L729 341" stroke="#e15759" stroke-width="5" stroke-linecap="round"/>
<line x1="440" y1="140" x2="456" y2="186" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="250" x2="516" y2="296" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="700" y1="300" x2="716" y2="254" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="735" y1="190" x2="751" y2="144" stroke="#666666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="30" y="410" font-size="24" text-anchor="start" class="sub">one thread: nested frames, not parallel ones</text>
</svg>
