<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>同じ nonce で作った 2 つの署名から秘密鍵が求まる</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e15759"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<text x="480" y="56" font-size="28" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">同じ nonce k を 2 回使った 2 つの署名</text>
<rect x="40" y="110" width="330" height="140" rx="14" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="205" y="154" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">署名 1</text>
<rect x="70" y="176" width="110" height="52" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="125" y="211" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">r</text>
<text x="270" y="211" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">s₁（z₁ に対して）</text>
<rect x="40" y="290" width="330" height="140" rx="14" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="205" y="334" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">署名 2</text>
<rect x="70" y="356" width="110" height="52" rx="10" fill="#f8eed8" stroke="#d4a24c" stroke-width="3"/>
<text x="125" y="391" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">r</text>
<text x="270" y="391" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">s₂（z₂ に対して）</text>
<text x="205" y="480" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">r は k だけで決まるので重なる</text>
<rect x="430" y="150" width="480" height="100" rx="12" fill="#f2f2f2" stroke="#666666" stroke-width="3"/>
<text x="670" y="192" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">k = (z₁ − z₂) / (s₁ − s₂)</text>
<text x="670" y="228" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">公開された値だけで計算できる</text>
<rect x="430" y="320" width="480" height="100" rx="12" fill="#fbe3e3" stroke="#e15759" stroke-width="3"/>
<text x="670" y="362" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">秘密鍵 d = (s₁·k − z₁) / r</text>
<text x="670" y="398" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">誰でも正当な署名を作れる</text>
<line x1="376" y1="180" x2="422.0" y2="195.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="376" y1="360" x2="422.0" y2="215.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="670" y1="256" x2="670.0" y2="312.0" stroke="#666666" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="670" y="480" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">計算は全て曲線の位数 n を法とする</text>
</svg>
