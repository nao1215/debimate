<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>NFT コントラクトが持つのは tokenId と所有者の対応と URI の文字列で、JSON と画像はチェーンの外のサーバーにある</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<rect width="960" height="540" fill="#ffffff"/>
<rect x="25" y="25" width="470" height="490" rx="16" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="3"/>
<text x="260" y="70" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">NFT コントラクト（チェーン上）</text>
<text x="130" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">tokenId</text>
<text x="345" y="122" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">ownerOf</text>
<rect x="55" y="138" width="410" height="52" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.8"/>
<text x="130" y="173" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">#1</text>
<text x="345" y="173" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">Counter</text>
<rect x="55" y="200" width="410" height="52" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="130" y="235" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">#2</text>
<text x="345" y="235" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">bob</text>
<rect x="55" y="262" width="410" height="52" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.8"/>
<text x="130" y="297" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">#3</text>
<text x="345" y="297" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">carol</text>
<rect x="55" y="324" width="410" height="52" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.8"/>
<text x="130" y="359" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">#4</text>
<text x="345" y="359" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">bob</text>
<rect x="55" y="400" width="410" height="92" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
<text x="260" y="436" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">tokenURI(2) が返す文字列</text>
<text x="260" y="474" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">https://…/2.json</text>
<rect x="560" y="25" width="375" height="490" rx="16" fill="#f8eed8" stroke="#d4a24c" stroke-width="3" stroke-dasharray="12 8"/>
<text x="747" y="70" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">チェーンの外（サーバー）</text>
<rect x="590" y="110" width="315" height="150" rx="8" fill="#ffffff" stroke="#1f1f1f" stroke-width="2.5"/>
<text x="747" y="146" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">2.json</text>
<text x="612" y="190" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">&quot;name&quot;: &quot;#2&quot;</text>
<text x="612" y="232" font-size="24" font-weight="normal" text-anchor="start" style="fill:#1f1f1f">&quot;image&quot;: &quot;…png&quot;</text>
<rect x="660" y="315" width="175" height="130" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<polyline points="680,425 725,365 760,405 785,380 815,425" fill="none" stroke="#666666" stroke-width="3" stroke-linejoin="round"/>
<circle cx="790" cy="345" r="12" fill="none" stroke="#666666" stroke-width="3"/>
<text x="747" y="488" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">画像</text>
<line x1="465" y1="446" x2="584" y2="200" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="747" y1="262" x2="747" y2="309" stroke="#1f1f1f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
