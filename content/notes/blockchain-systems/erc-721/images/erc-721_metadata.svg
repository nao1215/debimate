<text x="594" y="445" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">green.svg</text>
<text x="821" y="45" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">サーバーで削除</text>
