<rect x="272" y="310" width="190" height="180" rx="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"/>
<text x="367" y="352" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">v1/2.json</text>
<text x="367" y="405" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#666666">image</text>
<text x="367" y="445" font-size="26" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">red.svg</text>
<text x="594" y="45" font-size="24" font-weight="normal" text-anchor="middle" style="fill:#1f1f1f">setBaseURI(v2)</text>
