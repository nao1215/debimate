<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Shanghai では同じアドレスに V2 が置かれ、Cancun 以降は V1 が残る</title>
<style>text{font-family:'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#1f1f1f} .sub{fill:#666666}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="330.0" y="50" font-size="24" text-anchor="middle" class="sub">1〜2 作る</text>
<text x="580.0" y="50" font-size="24" text-anchor="middle" class="sub">3 消す</text>
<text x="830.0" y="50" font-size="24" text-anchor="middle" class="sub">4〜5 作り直す</text>
<text x="30" y="92" font-size="24" text-anchor="start" class="sub">0xCB8956e6… にあるコード</text>
<text x="30" y="184.0" font-size="26" text-anchor="start">Shanghai</text>
<rect x="230" y="120" width="200" height="110" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="330.0" y="168" font-size="26" text-anchor="middle">V1</text>
<text x="330.0" y="204" font-size="24" text-anchor="middle" class="sub">version 1</text>
<line x1="436" y1="175.0" x2="462" y2="175.0" stroke="#1f1f1f" stroke-width="3"/>
<polygon points="474,175.0 462,167.0 462,183.0" fill="#1f1f1f"/>
<rect x="480" y="120" width="200" height="110" rx="8" fill="#ffffff" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/>
<text x="580.0" y="168" font-size="26" text-anchor="middle">空</text>
<text x="580.0" y="204" font-size="24" text-anchor="middle" class="sub">0 bytes</text>
<line x1="686" y1="175.0" x2="712" y2="175.0" stroke="#1f1f1f" stroke-width="3"/>
<polygon points="724,175.0 712,167.0 712,183.0" fill="#1f1f1f"/>
<rect x="730" y="120" width="200" height="110" rx="8" fill="#f8eed8" stroke="#d4a24c" stroke-width="2"/>
<text x="830.0" y="168" font-size="26" text-anchor="middle">V2</text>
<text x="830.0" y="204" font-size="24" text-anchor="middle" class="sub">version 2</text>
<text x="30" y="364.0" font-size="26" text-anchor="start">Cancun 以降</text>
<rect x="230" y="300" width="200" height="110" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="330.0" y="348" font-size="26" text-anchor="middle">V1</text>
<text x="330.0" y="384" font-size="24" text-anchor="middle" class="sub">version 1</text>
<line x1="436" y1="355.0" x2="462" y2="355.0" stroke="#1f1f1f" stroke-width="3"/>
<polygon points="474,355.0 462,347.0 462,363.0" fill="#1f1f1f"/>
<rect x="480" y="300" width="200" height="110" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="580.0" y="348" font-size="26" text-anchor="middle">V1 のまま</text>
<text x="580.0" y="384" font-size="24" text-anchor="middle" class="sub">218 bytes</text>
<line x1="686" y1="355.0" x2="712" y2="355.0" stroke="#1f1f1f" stroke-width="3"/>
<polygon points="724,355.0 712,347.0 712,363.0" fill="#1f1f1f"/>
<rect x="730" y="300" width="200" height="110" rx="8" fill="#eaf1f5" stroke="#7aa6c2" stroke-width="2"/>
<text x="830.0" y="348" font-size="26" text-anchor="middle">V1 のまま</text>
<text x="830.0" y="384" font-size="24" text-anchor="middle" class="sub">version 1</text>
<line x1="620" y1="440" x2="644" y2="464" stroke="#e15759" stroke-width="5"/>
<line x1="620" y1="464" x2="644" y2="440" stroke="#e15759" stroke-width="5"/>
<text x="930" y="461" font-size="24" text-anchor="end" class="sub">Deployer を作り直せない</text>
<text x="930" y="500" font-size="24" text-anchor="end" class="sub">V2 は 0x673a327D… へ</text>
</svg>
