# Render with comic-writer build -o /tmp/weeknote-comic/dist scripts/weeknotes/comic-example.yaml
# Existing Rabbit Run artwork; no newly generated illustrations.
title: 初心者
reading: ltr
page: {width: 1200, height: 1200, margin: 20, gutter: 16, border: 3}
font:
  file: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
  size: 28
styles:
  speech: {writing: vertical}
  impact: {base: plain, writing: horizontal, color: "#111111", outline: 7, outline_color: "#ffffff"}
layouts:
  match:
    - [51, 0, 49, 29]
    - [0, 0, 49, 29]
    - [[0, 31], [100, 31], [100, 68], [0, 73]]
    - [[51, 73.5], [100, 70], [100, 100], [51, 100]]
    - [[0, 75], [49, 73.5], [49, 100], [0, 100]]
pages:
  - layout: match
    panels:
      - image: ../../../rabbitrun/assets/characters/cool/images/cg_gaming.jpg
        shot: bust
        face: [49, 11]
        focus: [50, 17]
        dialogue:
          - {text: "このゲーム初めて？", at: top_right, width: 60}
      - image: ../../../rabbitrun/assets/characters/gyal/images/cg_look_back.jpg
        shot: close_up
        face: [57, 13]
        dialogue:
          - {text: "うん。\nやったことないよ", at: top_left, width: 60}
      - image: ../../../rabbitrun/assets/characters/gyal/images/cg_gaming.jpg
        shot: bust
        face: [59, 13]
        focus: [48, 20]
        effect: speed_lines
        dialogue:
          - {text: "よし、\n十連勝！", style: shout, at: top_right, width: 60, size: 36}
          - {text: "ＫＯ！", style: impact, at: bottom_left, size: 100, rotate: -12}
      - image: ../../../rabbitrun/assets/characters/cool/images/worried.png
        shot: close_up
        face: [50, 11]
        color: "#e8edf3"
        dialogue:
          - {text: "嘘つき", at: top_right, width: 60}
      - image: ../../../rabbitrun/assets/characters/gyal/images/perfect.png
        shot: close_up
        face: [59, 9]
        color: "#fff3dc"
        dialogue:
          - {text: "あなたが\n下手なだけよ", at: top_left, width: 60}
